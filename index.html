<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>AEO·GEO Lab — Plan de consultoría 90 días</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600&display=swap');

:root {
  --paper:#F8FAFC;
  --paper-soft:#F1F5F9;
  --ink:#0F172A;
  --ink-soft:#475569;
  --ink-faint:#94A3B8;
  --line:#E2E8F0;
  --shadow:0 1px 3px rgba(15,23,42,0.07),0 1px 0 rgba(15,23,42,0.04);

  --void:#0F172A;
  --void-soft:#1E293B;
  --cyan:#0EA5E9;
  --cyan-deep:#0369A1;
  --cyan-pale:#E0F2FE;
  --violet:#7C3AED;
  --violet-deep:#5B21B6;
  --violet-pale:#EDE9FE;
  --emerald:#059669;
  --emerald-pale:#ECFDF5;
  --amber:#D97706;
  --amber-pale:#FFFBEB;
  --rose:#E11D48;
  --rose-pale:#FFF1F2;

  --neon-cyan:#22D3EE;
  --neon-violet:#A78BFA;
  --neon-grad:linear-gradient(135deg,var(--neon-cyan) 0%,var(--violet) 100%);
  --neon-grad-soft:linear-gradient(135deg,rgba(34,211,238,0.1) 0%,rgba(124,58,237,0.1) 100%);
  --neon-glow:0 0 0 1px rgba(124,58,237,0.3),0 0 20px rgba(124,58,237,0.15);
  --neon-glow-cyan:0 0 0 1px rgba(34,211,238,0.4),0 0 16px rgba(34,211,238,0.2);
  --glow-emerald:0 0 0 1px rgba(5,150,105,0.4),0 0 14px rgba(5,150,105,0.2);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(ellipse 900px 600px at 0% -5%,rgba(14,165,233,0.06),transparent),
    radial-gradient(ellipse 700px 500px at 100% 10%,rgba(124,58,237,0.05),transparent);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 80px;}

/* HEADER */
.slate{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:18px;padding-bottom:20px;border-bottom:1px solid var(--line);
}
.slate-brand{font-weight:800;font-size:21px;letter-spacing:-0.01em;color:var(--ink);}
.slate-brand .aeo{color:var(--cyan-deep);}
.slate-brand .geo{color:var(--violet);}
.slate-brand .sep{color:var(--ink-faint);font-weight:400;margin:0 1px;}
.slate-sub{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px;}
.slate-stats{display:flex;gap:20px;align-items:center;}
.stat{display:flex;flex-direction:column;align-items:flex-end;}
.stat-num{font-size:24px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-0.02em;}
.stat-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px;}
.stat.streak-stat{background:var(--void);border-radius:10px;padding:8px 14px 7px;align-items:center;}
.stat-num.streak{color:var(--neon-cyan);text-shadow:0 0 16px rgba(34,211,238,0.5);}
.stat.streak-stat .stat-label{color:var(--neon-violet);opacity:0.9;}

/* COMPLIANCE BAR */
.compliance-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-radius:12px;padding:11px 16px;margin-bottom:20px;cursor:pointer;
  user-select:none;font-size:12.5px;font-weight:600;transition:all 0.2s;border:1px solid;
}
.comp-left{display:flex;align-items:center;gap:9px;line-height:1.3;}
.comp-icon{font-size:15px;}
.comp-cycle{font-size:10.5px;font-weight:600;opacity:0.7;white-space:nowrap;text-transform:uppercase;letter-spacing:0.06em;}
.compliance-bar.pendiente{background:var(--rose-pale);border-color:rgba(225,29,72,0.3);color:var(--rose);}
.compliance-bar.enviada{background:var(--cyan-pale);border-color:rgba(3,105,161,0.3);color:var(--cyan-deep);}
.compliance-bar.aprobada{background:var(--void);border-color:transparent;color:var(--neon-cyan);box-shadow:var(--glow-emerald);}
.compliance-bar.aprobada .comp-cycle{color:var(--neon-violet);}

/* PROGRESS RAIL */
.rail-card{
  background:white;border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow);
}
.rail-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.rail-title{font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
.rail-pct{font-size:14px;color:var(--violet-deep);font-weight:700;}
.rail-track{height:7px;background:var(--paper-soft);border-radius:6px;overflow:hidden;}
.rail-fill{height:100%;background:var(--neon-grad);border-radius:6px;transition:width 0.6s cubic-bezier(.22,1,.36,1);}
.rail-phases{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;color:var(--ink-faint);gap:4px;}
.rail-phases span{flex:1;text-align:center;}
.rail-phases span:first-child{text-align:left;}
.rail-phases span:last-child{text-align:right;}
.rail-phases span.active{color:var(--violet-deep);font-weight:700;}

/* MISSION CARD */
.mission-card{
  background:white;border:1px solid var(--line);border-radius:18px;padding:0;
  margin-bottom:18px;box-shadow:0 4px 20px rgba(15,23,42,0.07),var(--shadow);
  overflow:hidden;position:relative;
}
.mission-tape{position:absolute;top:0;left:0;right:0;height:4px;background:var(--neon-grad);}
.mission-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0;}
.mission-tag{
  font-size:10.5px;font-weight:700;letter-spacing:0.1em;color:white;
  background:var(--void);padding:5px 10px;border-radius:5px;
  font-family:'JetBrains Mono',monospace;
}
.phase-tag{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--cyan-deep);font-weight:600;}
.mission-body{padding:16px 24px 24px;}
.mission-title{
  font-size:23px;font-weight:700;line-height:1.28;color:var(--ink);
  margin:6px 0 10px;letter-spacing:-0.01em;
}
.mission-desc{font-size:14.5px;line-height:1.65;color:var(--ink-soft);margin-bottom:16px;}
.mission-meta{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.meta-pill{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);
  background:var(--paper-soft);padding:5px 11px;border-radius:20px;border:1px solid var(--line);
}
.meta-pill b{color:var(--ink);font-weight:600;}

/* COLLAPSIBLE SECTION TOGGLE (tutorial + chat share base) */
.sec-toggle{
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  user-select:none;font-size:13px;font-weight:600;padding:11px 0;margin-bottom:6px;
  border-top:1px dashed var(--line);
}
.sec-toggle.tut{color:var(--cyan-deep);}
.sec-toggle.chat{color:var(--violet-deep);border-bottom:1px dashed var(--line);}
.sec-toggle:hover{color:var(--violet);}
.sec-toggle-left{display:flex;align-items:center;gap:8px;}
.sec-chevron{font-size:11px;transition:transform 0.25s;color:var(--ink-faint);}
.sec-chevron.open{transform:rotate(180deg);}
.mini-badge{
  font-size:11px;color:var(--ink-faint);font-weight:600;background:var(--paper-soft);
  padding:2px 9px;border-radius:10px;border:1px solid var(--line);transition:all 0.2s;
}
.mini-badge.complete{background:var(--void);color:var(--neon-cyan);border-color:transparent;box-shadow:var(--neon-glow-cyan);}

.panel{display:none;}
.panel.open{display:block;}

/* TUTORIAL PANEL */
.tutorial-panel{background:var(--paper-soft);border-radius:10px;padding:16px 16px 18px;margin-bottom:16px;}
.level-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.level-bar-track{flex:1;height:5px;background:var(--line);border-radius:6px;overflow:hidden;}
.level-bar-fill{height:100%;background:var(--neon-grad);border-radius:6px;transition:width 0.45s cubic-bezier(.22,1,.36,1);}
.level-bar-label{font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}

.why-box{
  display:flex;gap:10px;background:white;border:1px solid var(--cyan-pale);
  border-left:3px solid var(--cyan);border-radius:8px;padding:11px 14px;
  margin-bottom:14px;font-size:13px;color:var(--ink-soft);line-height:1.55;
}
.why-box b{color:var(--cyan-deep);}

.tutorial-step{
  background:white;border:1px solid var(--line);border-radius:10px;
  margin-bottom:7px;overflow:hidden;transition:border-color 0.2s,background 0.2s;
}
.tutorial-step.step-done{background:var(--emerald-pale);border-color:var(--emerald);}
.tutorial-step-row{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;cursor:pointer;}
.step-check{
  flex-shrink:0;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-faint);
  background:white;margin-top:1px;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:transparent;transition:all 0.15s;
}
.tutorial-step.step-done .step-check{background:var(--emerald);border-color:var(--emerald);color:white;}
.step-main{flex:1;}
.step-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.45;}
.tutorial-step.step-done .step-title{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--ink-faint);}
.step-title .step-num-tag{color:var(--violet);font-weight:700;margin-right:4px;}
.step-title b{color:var(--cyan-deep);font-weight:600;}
.step-title i,.step-detail i{font-style:italic;color:var(--ink);}
.step-title code,.step-detail code{
  background:var(--paper-soft);padding:1px 6px;border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--violet-deep);font-style:normal;
}
.step-detail{
  font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:6px;
  padding-top:8px;border-top:1px dashed var(--line);
}
.step-detail b{color:var(--cyan-deep);font-weight:600;}

.tutorial-tip{
  display:flex;gap:10px;background:var(--amber-pale);border-radius:8px;
  padding:10px 14px;margin-top:10px;font-size:12.5px;color:var(--amber);
  line-height:1.5;border:1px solid rgba(217,119,6,0.2);
}
.tutorial-tip b{color:var(--ink);}
.tutorial-complete-banner{
  display:flex;align-items:center;gap:8px;background:var(--void);color:var(--neon-cyan);
  border-radius:8px;padding:10px 14px;margin-top:10px;font-size:12.5px;font-weight:600;
  box-shadow:var(--neon-glow-cyan);
}

/* CHAT PANEL */
.chat-panel{background:var(--paper-soft);border-radius:10px;padding:14px;margin-bottom:16px;}
.chat-connect{text-align:center;padding:6px 4px;}
.chat-connect-title{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.chat-connect-sub{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;}
.chat-connect-sub a{color:var(--violet-deep);font-weight:600;}
.chat-key-row{display:flex;gap:8px;}
.chat-key-input{
  flex:1;border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);
}
.chat-key-input:focus{outline:none;border-color:var(--violet);box-shadow:var(--neon-glow);}
.chat-key-note{font-size:10.5px;color:var(--ink-faint);margin-top:9px;line-height:1.45;}

.chat-log{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow-y:auto;margin-bottom:10px;padding-right:2px;}
.chat-msg{font-size:13px;line-height:1.55;border-radius:10px;padding:9px 12px;max-width:92%;}
.chat-msg.user{align-self:flex-end;background:var(--void);color:white;border-bottom-right-radius:3px;}
.chat-msg.assistant{align-self:flex-start;background:white;border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:3px;}
.chat-msg.assistant b{color:var(--violet-deep);}
.chat-msg.assistant code{background:var(--paper-soft);padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--violet-deep);}
.chat-msg.thinking{align-self:flex-start;color:var(--ink-faint);font-style:italic;font-size:12.5px;}
.chat-msg.error{align-self:stretch;max-width:100%;background:var(--rose-pale);border:1px solid rgba(225,29,72,0.25);color:var(--rose);font-size:12px;}

.chat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chat-chip{
  font-size:11.5px;font-weight:500;color:var(--violet-deep);background:white;
  border:1px solid var(--violet-pale);border-radius:16px;padding:5px 11px;cursor:pointer;transition:all 0.15s;
}
.chat-chip:hover{background:var(--violet);color:white;border-color:var(--violet);}

.chat-input-row{display:flex;gap:8px;align-items:flex-end;}
.chat-input{
  flex:1;border:1px solid var(--line);background:white;border-radius:10px;padding:10px 12px;
  font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);resize:none;min-height:42px;max-height:120px;line-height:1.5;
}
.chat-input:focus{outline:none;border-color:var(--violet);box-shadow:var(--neon-glow);}
.chat-send{
  background:var(--violet);color:white;border:none;border-radius:10px;padding:0 16px;height:42px;
  font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.chat-send:hover{background:var(--void);box-shadow:var(--neon-glow);}
.chat-send:disabled{opacity:0.45;cursor:not-allowed;}
.chat-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.chat-model{font-size:10px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.chat-key-manage{font-size:10.5px;color:var(--ink-faint);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;}
.chat-key-manage:hover{color:var(--rose);}

/* TIMER */
.timer-zone{
  display:flex;align-items:center;gap:16px;background:var(--paper-soft);
  border-radius:12px;padding:14px 18px;margin-bottom:16px;border:1px solid var(--line);
}
.timer-display{
  font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:600;
  color:var(--ink);min-width:88px;letter-spacing:0.02em;
}
.timer-display.running{color:var(--cyan-deep);}
.timer-controls{display:flex;gap:8px;flex:1;}
.tbtn{
  border:1px solid var(--line);background:white;color:var(--ink);font-family:'Inter',sans-serif;
  font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer;transition:all 0.15s;
}
.tbtn:hover{background:var(--void);color:white;border-color:var(--neon-violet);box-shadow:var(--neon-glow);}
.tbtn:active{transform:scale(0.97);}
.tbtn.primary{background:var(--violet);color:white;border-color:var(--violet);}
.tbtn.primary:hover{background:var(--void);border-color:var(--neon-cyan);box-shadow:var(--neon-glow-cyan);}

textarea.log-input{
  width:100%;border:1px solid var(--line);background:white;border-radius:10px;
  padding:12px 14px;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
  resize:vertical;min-height:62px;margin-bottom:14px;line-height:1.5;
}
textarea.log-input:focus{outline:none;border-color:var(--violet);box-shadow:var(--neon-glow);}
textarea.log-input::placeholder{color:var(--ink-faint);}

.action-row{display:flex;gap:10px;}
.btn-complete{
  flex:1;background:var(--void);color:white;border:1px solid var(--void);
  font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:14px;
  border-radius:10px;cursor:pointer;transition:all 0.15s;letter-spacing:0.01em;
}
.btn-complete:hover{background:var(--violet);border-color:var(--violet);box-shadow:var(--neon-glow);transform:translateY(-1px);}
.btn-complete:active{transform:translateY(0);}
.btn-skip{
  background:transparent;color:var(--ink-faint);border:1px solid var(--line);
  font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:14px 18px;
  border-radius:10px;cursor:pointer;transition:all 0.15s;
}
.btn-skip:hover{color:var(--violet);border-color:var(--violet);}

/* DONE STATE */
.done-flash{text-align:center;padding:48px 24px;}
.done-icon{font-size:40px;margin-bottom:6px;}
.done-title{font-size:22px;font-weight:700;margin-bottom:8px;letter-spacing:-0.01em;}
.done-sub{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px;}
.empty-state{text-align:center;padding:56px 24px;}
.empty-state .done-icon{font-size:46px;}

/* HISTORY + GLOSSARY toggles */
.list-toggle{
  display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  padding:14px 20px;background:white;border:1px solid var(--line);border-radius:14px;
  margin-bottom:12px;user-select:none;box-shadow:var(--shadow);
}
.list-toggle:hover{background:var(--paper-soft);}
.list-toggle-label{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
.list-chevron{font-size:13px;color:var(--ink-faint);transition:transform 0.25s;}
.list-chevron.open{transform:rotate(180deg);}
.list-panel{display:none;margin-bottom:20px;}
.list-panel.open{display:block;}

.phase-block{margin-bottom:18px;}
.phase-block-head{
  font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--violet-deep);
  font-weight:700;margin:0 4px 8px;display:flex;justify-content:space-between;
}
.task-row{
  display:flex;align-items:flex-start;gap:12px;background:white;border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;margin-bottom:6px;box-shadow:var(--shadow);
}
.task-row.done{opacity:0.5;}
.task-check{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-faint);
  flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:transparent;
}
.task-row.done .task-check{background:var(--emerald);border-color:var(--emerald);color:white;}
.task-text{flex:1;}
.task-text-title{font-size:13.5px;color:var(--ink);font-weight:500;line-height:1.4;}
.task-row.done .task-text-title{text-decoration:line-through;text-decoration-color:var(--ink-faint);}
.task-note{font-size:12px;color:var(--ink-soft);margin-top:3px;font-style:italic;line-height:1.4;}
.task-when{font-size:10.5px;color:var(--ink-faint);white-space:nowrap;margin-top:2px;}

/* GLOSSARY */
.gloss-panel{padding:2px 2px 8px;}
.gloss-item{background:white;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:8px;box-shadow:var(--shadow);}
.gloss-item h4{margin:0 0 5px;font-size:13.5px;color:var(--ink);font-weight:700;}
.gloss-item h4 .gloss-num{color:var(--violet);font-family:'JetBrains Mono',monospace;margin-right:6px;}
.gloss-item p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
.gloss-item p b{color:var(--cyan-deep);}
.gloss-item code{background:var(--paper-soft);padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--violet-deep);}
.gloss-section-label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--violet-deep);font-weight:700;margin:6px 4px 10px;}

.reset-zone{text-align:center;margin-top:30px;padding-top:18px;border-top:1px solid var(--line);}
.reset-link{
  font-size:11.5px;color:var(--ink-faint);text-decoration:underline;cursor:pointer;
  background:none;border:none;font-family:'Inter',sans-serif;
}
.reset-link:hover{color:var(--rose);}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--void);color:white;font-size:13px;font-weight:500;padding:11px 20px;
  border-radius:10px;opacity:0;pointer-events:none;transition:all 0.3s ease;z-index:50;
  white-space:nowrap;box-shadow:0 0 0 1px rgba(34,211,238,0.2),0 8px 24px rgba(0,0,0,0.2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:480px){
  .slate{flex-direction:column;gap:14px;}
  .slate-stats{align-self:flex-end;}
  .mission-title{font-size:20px;}
  .timer-display{font-size:26px;}
  .rail-phases{font-size:9px;}
}
</style>
</head>
<body>

    if (!state.stepProgress) state.stepProgress = {};
    if (!state.chats) state.chats = {};
    if (!state.compliance) state.compliance = 'pendiente';
  } catch(e){}
}
function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function getKey(){ try { return localStorage.getItem(KEY_STORAGE) || ''; } catch(e){ return ''; } }
function setKey(k){ try { if(k){ localStorage.setItem(KEY_STORAGE, k); } else { localStorage.removeItem(KEY_STORAGE); } } catch(e){} }

function dayKey(d){ return d.toISOString().slice(0,10); }
function bumpStreak(){
  const today = dayKey(new Date());
  if (state.lastActiveDay === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  state.streak = state.lastActiveDay === dayKey(y) ? state.streak + 1 : 1;
  state.lastActiveDay = today;
}

let timer = { seconds:0, total:0, running:false, interval:null };
function pad2(n){ n = String(n); return n.length < 2 ? '0'+n : n; }
function fmt(s){ return pad2(Math.floor(s/60))+':'+pad2(s%60); }
function startTimer(totalSecs){
  clearInterval(timer.interval);
  timer.seconds = totalSecs; timer.total = totalSecs; timer.running = true;
  renderTimer();
  timer.interval = setInterval(()=>{
    timer.seconds -= 1;
    if (timer.seconds <= 0){ clearInterval(timer.interval); timer.running=false; timer.seconds=0; renderTimer(); showToast('Tiempo cumplido — marca la misión cuando estés listo'); return; }
    renderTimer();
  }, 1000);
}
function pauseTimer(){ clearInterval(timer.interval); timer.running=false; renderTimer(); }
function resumeTimer(){
  if (timer.seconds <= 0) return;
  timer.running = true; renderTimer();
  timer.interval = setInterval(()=>{
    timer.seconds -= 1;
    if (timer.seconds <= 0){ clearInterval(timer.interval); timer.running=false; timer.seconds=0; renderTimer(); showToast('Tiempo cumplido — marca la misión cuando estés listo'); return; }
    renderTimer();
  }, 1000);
}
function renderTimer(){
  const d = document.getElementById('timerDisplay');
  if (!d) return;
  d.textContent = fmt(timer.seconds);
  d.classList.toggle('running', timer.running);
}

function getStepProgress(taskId){
  if (!state.stepProgress) state.stepProgress = {};
  if (!state.stepProgress[taskId]) state.stepProgress[taskId] = {};
  return state.stepProgress[taskId];
}
function renderTutorialInner(task){
  const steps = task.tutorial || [];
  const progress = getStepProgress(task.id);
  const doneCount = steps.filter((s,i) => progress[i]).length;
  const pct = steps.length ? Math.round((doneCount/steps.length)*100) : 0;
  let html = '';
  if (task.why){
    html += `<div class="why-box">&#x1F3AF; <span><b>Por qué importa:</b> ${task.why}</span></div>`;
  }
  html += `
    <div class="level-bar-row">
      <span class="level-bar-label">Avance</span>
      <div class="level-bar-track"><div class="level-bar-fill" style="width:${pct}%"></div></div>
      <span class="level-bar-label">${doneCount}/${steps.length}</span>
    </div>`;
  steps.forEach((step, i) => {
    const isDone = !!progress[i];
    html += `
      <div class="tutorial-step${isDone?' step-done':''}">
        <div class="tutorial-step-row" data-toggle-step="${i}">
          <div class="step-check">${isDone?'&#x2713;':''}</div>
          <div class="step-main">
            <div class="step-title"><span class="step-num-tag">${i+1}.</span>${step.title}</div>
            <div class="step-detail">${step.detail}</div>
          </div>
        </div>
      </div>`;
  });
  if (task.tip){
    html += `<div class="tutorial-tip">&#x1F4A1; <span><b>Tip:</b> ${task.tip}</span></div>`;
  }
  if (steps.length && doneCount === steps.length){
    html += `<div class="tutorial-complete-banner">&#x1F3C6; Pasos completos — recorriste todo el tutorial de esta misión.</div>`;
  }
  return html;
}
function wireTutorialSteps(task){
  const panel = document.getElementById('tutorialPanel');
  if (!panel) return;
  panel.querySelectorAll('[data-toggle-step]').forEach(row => {
    row.onclick = () => {
      const i = row.getAttribute('data-toggle-step');
      const progress = getStepProgress(task.id);
      progress[i] = !progress[i];
      saveState();
      panel.innerHTML = renderTutorialInner(task);
      wireTutorialSteps(task);
      updateTutorialBadge(task);
    };
  });
}
function updateTutorialBadge(task){
  const badge = document.getElementById('tutBadge');
  if (!badge) return;
  const steps = task.tutorial || [];
  const progress = getStepProgress(task.id);
  const doneCount = steps.filter((s,i) => progress[i]).length;
  const complete = doneCount === steps.length && steps.length > 0;
  badge.textContent = complete ? '✓ completo' : `${doneCount}/${steps.length} pasos`;
  badge.classList.toggle('complete', !!complete);
}

function fmtChatText(s){

function renderChatInner(task){

function scrollChat(){ const log = document.getElementById('chatLog'); if (log) log.scrollTop = log.scrollHeight; }

async function callClaude(task){
  const key = getKey();
  const sys = buildSystemPrompt(task);
  const history = getChat(task.id).map(m => ({ role:m.role, content:m.content }));
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens: 1024,
      system: sys,
      messages: history
    })
  });
  if (!res.ok){
    let detail = '';
    try { const j = await res.json(); detail = (j.error && j.error.message) ? j.error.message : ''; } catch(e){}
    if (res.status === 401) throw new Error('API key inválida o vencida. Revisa que copiaste bien la key de console.anthropic.com.');
    if (res.status === 429) throw new Error('Límite de uso alcanzado (rate limit). Espera unos segundos y reintenta.');
    if (res.status === 400 && /credit|balance|billing/i.test(detail)) throw new Error('Tu cuenta de Anthropic no tiene saldo. Agrega crédito en console.anthropic.com → Billing.');
    throw new Error('Error de la API ('+res.status+'). '+detail);
  }
  const data = await res.json();
  if (data.stop_reason === 'refusal') return 'No puedo responder eso. Reformula la pregunta enfocándola en la ejecución del paso.';
  const text = (data.content||[]).filter(b => b.type==='text').map(b => b.text).join('').trim();
  return text || '(respuesta vacía — reintenta)';
}

async function sendChat(task, text){
  text = (text||'').trim();
  if (!text) return;
  const chat = getChat(task.id);
  chat.push({ role:'user', content:text });
  saveState();
  // re-render with the new user message + thinking indicator
  const panelHost = document.getElementById('chatPanelHost');
  panelHost.innerHTML = renderChatInner(task);
  wireChat(task);
  const log = document.getElementById('chatLog');
  const thinking = document.createElement('div');
  thinking.className = 'chat-msg thinking';
  thinking.textContent = 'Claude está pensando…';
  log.appendChild(thinking);
  scrollChat();
  const sendBtn = document.getElementById('chatSend');
  if (sendBtn) sendBtn.disabled = true;
  try {
    const answer = await callClaude(task);
    chat.push({ role:'assistant', content:answer });
    saveState();
  } catch(err){
    // remove thinking, show error
    panelHost.innerHTML = renderChatInner(task);
    wireChat(task);
    const log2 = document.getElementById('chatLog');
    const errDiv = document.createElement('div');
    errDiv.className = 'chat-msg error';
    errDiv.textContent = '⚠ ' + (err.message || 'No se pudo conectar. Si abriste el archivo con file:// y falla, sírvelo por localhost.');
    log2.appendChild(errDiv);
    scrollChat();
    return;
  }
  panelHost.innerHTML = renderChatInner(task);
  wireChat(task);
  scrollChat();
}

function wireChat(task){
  const host = document.getElementById('chatPanelHost');
  if (!host) return;
  const keySave = document.getElementById('keySave');
  if (keySave){
    keySave.onclick = ()=>{
      const v = document.getElementById('keyInput').value.trim();
      if (!v){ showToast('Pega tu API key primero'); return; }
      setKey(v);
      host.innerHTML = renderChatInner(task);
      wireChat(task);
      showToast('Claude conectado');
    };
    const ki = document.getElementById('keyInput');
    if (ki) ki.onkeydown = (e)=>{ if (e.key==='Enter'){ e.preventDefault(); keySave.click(); } };
    return;
  }
  const sendBtn = document.getElementById('chatSend');
  const input = document.getElementById('chatInput');
  if (sendBtn && input){
    sendBtn.onclick = ()=>{ const v = input.value; input.value=''; sendChat(task, v); };
    input.onkeydown = (e)=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendBtn.click(); } };
  }
  host.querySelectorAll('.chat-chip').forEach(chip=>{
    chip.onclick = ()=> sendChat(task, chip.getAttribute('data-q'));
  });
  const km = document.getElementById('keyManage');
  if (km){
    km.onclick = ()=>{
      if (confirm('¿Quitar la API key de este navegador? El chat dejará de funcionar hasta que pegues otra.')){
        setKey('');
        host.innerHTML = renderChatInner(task);
        wireChat(task);
      }
    };
  }
}

        <div class="task-check">${done?'&#x2713;':''}</div>
        <div class="task-text">
          <div class="task-text-title">${t.title}</div>
          ${done && done.note ? `<div class="task-note">"${escapeHtml(done.note)}"</div>` : ''}
        </div>
        <div class="task-when">${when}</div>`;
      block.appendChild(row);
    });
    panel.appendChild(block);
  });
}

// ============================================================
// GLOSSARY
// ============================================================
function renderGlossary(){
  const panel = document.getElementById('glossPanel');
  let html = '<div class="gloss-panel">';
  html += '<div class="gloss-section-label">Los 5 factores técnicos de AEO/GEO</div>';
  GLOSSARY.factores.forEach(f => {
    html += `<div class="gloss-item"><h4><span class="gloss-num">${f.n}</span>${f.t}</h4><p>${f.d}</p></div>`;
  });
  html += '<div class="gloss-section-label" style="margin-top:16px;">El flujo del audit en 6 pasos</div>';
  GLOSSARY.audit.forEach(a => {
    html += `<div class="gloss-item"><h4><span class="gloss-num">${a.n}</span>${a.t}</h4><p>${a.d}</p></div>`;
  });
  html += '</div>';
  panel.innerHTML = html;
}

// ============================================================
// INIT
// ============================================================
loadState();
renderCompliance();
renderMission();
renderHistory();
renderGlossary();

document.getElementById('historyToggle').onclick = () => {
  document.getElementById('historyPanel').classList.toggle('open');
  document.getElementById('historyChevron').classList.toggle('open');
};
document.getElementById('glossToggle').onclick = () => {
  document.getElementById('glossPanel').classList.toggle('open');
  document.getElementById('glossChevron').classList.toggle('open');
};
document.getElementById('resetBtn').onclick = () => {
  if (confirm('¿Reiniciar todo el progreso del plan? Esto borra misiones completadas, racha, notas y conversaciones. (Tu API key NO se borra.)')){
    state = { completed:{}, stepProgress:{}, chats:{}, compliance:'pendiente', streak:0, lastActiveDay:null };
    saveState(); renderCompliance(); renderMission(); renderHistory();
    showToast('Progreso reiniciado. Plan listo para empezar de nuevo.');
  }
};

})();
