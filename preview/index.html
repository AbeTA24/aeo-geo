}
function completeWebStep(id, extra){
  state.webSteps[id] = Object.assign({ ts: new Date().toISOString() }, extra || {});
  syncLinearFromWeb();
  recordActivity();
  vibrate(12);
  const m = webMission(id);
  const pr = webProgress(m.steps);
  let missionDone = false;
  if (pr.done === pr.total && !state.webMissions[m.id]){
    state.webMissions[m.id] = new Date().toISOString();
    state.freezes = Math.min(2, state.freezes + 1);
    missionDone = true;
  }
  saveState();
  const remaining = pr.total - pr.done;
  showCelebration(missionDone ? {
    title: 'Misión completada.',
    line: m.id + ' · ' + m.title + '. ' + pickCelebration(),
    insight: pickInsight(),
    extra: 'Ganaste 1 protector de racha',
  } : {
    title: 'Paso hecho.',
    line: pickCelebration() + ' ' + (remaining === 1 ? 'Te queda 1 paso' : ('Te quedan ' + remaining + ' pasos')) + ' en ' + m.id + '.',
    insight: pickInsight(),
  });
}
function requestWebStepDone(id, opener){
  const s = WEB_STEPS[id];
  const miss = missingReqs(id);
  let forced = false;
  if (miss.length){
    if (!confirm('Este paso está bloqueado. Antes necesitas: ' + miss.map(idLabel).join(', ') + '.\n\n¿Marcarlo como hecho de todos modos? Quedará registrado que lo forzaste.')) return;
    forced = true;
  }
  const finish = paid => {
    closeOverlay();
    completeWebStep(id, Object.assign({}, forced ? { forced:true } : {}, paid ? { paid } : {}));
  };
  if (isPaidStep(s)) openPaySheet(id, opener, finish);
  else finish(null);
}
function undoWebStep(id){
  if (!confirm('¿Desmarcar ' + id + '? Si registraste un pago, también se borra de la cuenta.')) return;
  delete state.webSteps[id];
  saveState();
}

// --- Vistas del proyecto web ---
function reqLinks(ids){
  if (!ids.length) return '<span class="none-txt">nada</span>';
  return ids.map(r => `<button type="button" class="req-link ${webStatus(r)}" data-goto="${r}">${webStatus(r) === 'done' ? '✓ ' : ''}${idLabel(r)}</button>`).join('');
}
function webStepRow(id){
  const s = WEB_STEPS[id];
  const st = webStatus(id);
  const miss = missingReqs(id);
  const stTxt = st === 'done' ? 'Hecho' : (st === 'locked' ? '🔒 Antes: ' + miss.map(idLabel).join(', ') : (s.linked ? 'Se marca con compliance' : 'Disponible'));
  return `<div class="step-row w-row ${st}" data-wstep="${id}" role="button" tabindex="0">
    <span class="s-num tnum">${id}</span>
    <span class="s-check${st === 'locked' ? ' lock' : ''}">${st === 'locked' ? '🔒' : ''}</span>
    <div class="s-main">
      <div class="s-title">${escapeHtml(s.title)}${s.optional ? ' <span class="opt-tag">opcional</span>' : ''}</div>
      <div class="w-meta">${costBadge(s.cost)}<span class="w-st">${stTxt}</span></div>
    </div>
  </div>`;
}
function openWebMission(mid, back){
  const m = WEB_MISSIONS.find(x => x.id === mid);
  if (!m) return;
  closeOverlay();
  const sp = webSp(m.sp);
  const pr = webProgress(m.steps);
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'overlay';
  ov.innerHTML = `<div class="ov-inner">
    <div class="ov-top"><button class="ov-back" id="ovBack">Plan</button><span class="lbl">Proyecto web</span></div>
    <span class="lbl forest">${sp.id} · ${escapeHtml(sp.title)}</span>
    <h1 class="d-title">${m.id} · ${escapeHtml(m.title)}</h1>
    <div class="w-meta big">${missionCostBadge(m)}<span class="w-st">${pr.done}/${pr.total} pasos${missionStatus(m) === 'locked' ? ' · 🔒 bloqueada' : ''}</span></div>
    <div class="mini-progress"><span class="lbl tnum">${pr.done}/${pr.total}</span><div class="mini-track"><div class="mini-fill" style="width:${Math.round(pr.done / pr.total * 100)}%"></div></div></div>
    <div class="step-block">${m.steps.map(webStepRow).join('')}</div>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('ovBack').onclick = () => { closeOverlay(); if (back) back(); else render(); };
  ov.querySelectorAll('[data-wstep]').forEach(r => {
    const go = () => openWebStep(r.getAttribute('data-wstep'), () => openWebMission(mid, back));
    r.onclick = go;
    r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
  });
}
function openWebStep(id, back){
  if (id === 'GATE'){ openGate(back); return; }
  const s = WEB_STEPS[id];
  if (!s) return;
  closeOverlay();
  const m = webMission(id);
  const sp = webSp(m.sp);
  const st = webStatus(id);
  const miss = missingReqs(id);
  const rec = state.webSteps[id];
  const unl = WEB_UNLOCKS[id];
  let html = `<div class="ov-inner">
    <div class="ov-top"><button class="ov-back" id="ovBack">${back ? 'Volver' : m.id}</button><span class="lbl">Paso ${id}</span></div>
    <span class="lbl forest">${sp.id} · ${escapeHtml(sp.title)} — ${m.id}</span>
    <h1 class="d-title">${escapeHtml(s.title)}</h1>
    <div class="w-meta big">${costBadge(s.cost)}<span class="w-st ${st}">${st === 'done' ? 'Hecho' : st === 'locked' ? '🔒 Bloqueado' : 'Disponible'}</span>${s.optional ? '<span class="opt-tag">opcional</span>' : ''}${s.criterio ? critTag() : ''}</div>`;
  if (st === 'locked'){
    html += `<div class="lock-box"><div class="lock-h">🔒 Antes necesitas</div><div class="req-links">${reqLinks(miss)}</div><div class="lock-sub">Puedes leer este paso, pero no marcarlo como hecho hasta completar lo anterior.</div></div>`;
  }
  if (s.linked === 'compliance'){
    html += `<div class="linked-box">Este paso se marca solo: cuenta como hecho cuando pongas Compliance en <b>APROBADA</b>. Estado actual: <b>${state.compliance.toUpperCase()}</b>. <button type="button" class="link-btn" id="goComp">cambiar en Datos</button></div>`;
  }
  html += `<div class="cost-line"><span class="cl-l">Costo</span><span>${escapeHtml(s.cost.label || costBadgeText(s.cost))}${s.cost.note ? ' — ' + rich(s.cost.note) : ''}${!s.cost.note && s.cost.sourceIds ? ' ' + s.cost.sourceIds.map(chipHtml).join(' ') : ''}</span></div>`;
  if (s.condition) html += `<div class="cost-line"><span class="cl-l">Condición</span><span>${escapeHtml(s.condition)}</span></div>`;
  if (s.start && st !== 'done') html += startBoxHtml(id);
  if (s.body){
    html += `<div class="w-sec-h">Qué hacer</div><ol class="w-steps">${s.body.steps.map(x => `<li>${rich(x)}</li>`).join('')}</ol>`;
    if (s.body.why) html += `<div class="why-box"><div class="why-label">Por qué</div><div class="why-text">${rich(s.body.why)}</div></div>`;
    if (s.body.extra) html += `<div class="tip-box"><div class="tip-text">${rich(s.body.extra)}</div></div>`;
    if (s.body.done) html += `<div class="cost-line"><span class="cl-l">Listo cuando</span><span>${rich(s.body.done)}</span></div>`;
  } else {
    html += `<div class="placeholder-box">El detalle completo de este paso (micro-pasos, por qué y cuándo está listo) se carga en la Fase 4. Aquí ya ves su lugar en el plan: dependencias, costo y fuentes.</div>`;
  }
  html += `<div class="deps"><div class="dep-row"><span class="cl-l">Requiere</span><div class="req-links">${reqLinks(webReqs(id))}</div></div>
    <div class="dep-row"><span class="cl-l">Desbloquea</span><div class="req-links">${reqLinks(unl)}</div></div></div>`;
  html += sourcesListHtml(stepSourceIds(id));
  html += `<div class="d-actions">`;
  if (s.linked){
    // se marca desde compliance
  } else if (rec){
    html += `<div class="done-line">✓ Hecho el ${fmtDay(rec.ts.slice(0, 10))}${rec.forced ? ' · <span class="forced">forzado</span>' : ''}${rec.paid ? ' · pagaste ' + fmtMoney(rec.paid.amount, rec.paid.currency) : ''}</div>
      <button type="button" class="link-btn" id="wUndo">desmarcar</button>`;
  } else if (st === 'locked'){
    html += `<button type="button" class="btn-main" disabled>Bloqueado</button>
      <button type="button" class="link-btn" id="wForce">marcar de todos modos (forzar)</button>`;
  } else {
    html += `<button type="button" class="btn-main" id="wDone">${isPaidStep(s) ? 'Paso hecho (registrar pago)' : 'Paso hecho'}</button>`;
  }
  html += `</div></div>`;
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'overlay';
  ov.innerHTML = html;
  document.body.appendChild(ov);
  const reopen = () => openWebStep(id, back);
  document.getElementById('ovBack').onclick = () => { closeOverlay(); if (back) back(); else openWebMission(m.id); };
  ov.querySelectorAll('[data-goto]').forEach(b => { b.onclick = () => openWebStep(b.getAttribute('data-goto'), reopen); });
  const wDone = document.getElementById('wDone');
  if (wDone) wDone.onclick = () => requestWebStepDone(id, wDone);
  const wForce = document.getElementById('wForce');
  if (wForce) wForce.onclick = () => requestWebStepDone(id, wForce);
  const wUndo = document.getElementById('wUndo');
  if (wUndo) wUndo.onclick = () => { undoWebStep(id); reopen(); };
  const goComp = document.getElementById('goComp');
  if (goComp) goComp.onclick = () => { closeOverlay(); setTab('datos'); };
}

// Mapa: posiciones fijas pensadas para pantalla de celular (2 columnas).
const MAP_NODES = {
  S1:{c:0,r:0}, S2:{c:2,r:0}, S3:{c:2,r:1}, S4:{c:2,r:2}, S5:{c:2,r:3},
  S6:{c:1,r:4}, GATE:{c:1,r:5}, S7:{c:1,r:6}, S8:{c:0,r:7}, S9:{c:0,r:8}, S10:{c:2,r:8},
};
function openWebMap(){
  closeOverlay();
  const W = 340, BW = 140, BH = 48, RH = 72, X = [8, 100, 192];
  const pos = id => { const n = MAP_NODES[id]; return { x: X[n.c], y: 8 + n.r * RH }; };
  const H = 8 + 8 * RH + BH + 8;
  const stOf = id => id === 'GATE' ? (gateOpen() ? 'done' : 'locked') : spStatus(id);
  const ST_TXT = { done:'hecho', available:'disponible', locked:'bloqueado' };
  const P = id => pos(id);
  const cx = id => P(id).x + BW / 2, top = id => P(id).y, bot = id => P(id).y + BH, mid = id => P(id).y + BH / 2;
  const edges = [
    ['M', cx('S2'), bot('S2'), 'V', top('S3')],
    ['M', cx('S3'), bot('S3'), 'V', top('S4')],
    ['M', cx('S4'), bot('S4'), 'V', top('S5')],
    ['M', cx('S5'), bot('S5'), 'L', cx('S6') + 30, top('S6')],
    ['M', 40, bot('S1'), 'V', mid('S6'), 'H', P('S6').x],
    ['M', 30, bot('S1'), 'V', mid('GATE'), 'H', P('GATE').x],
    ['M', cx('S6'), bot('S6'), 'V', top('GATE')],
    ['M', cx('GATE'), bot('GATE'), 'V', top('S7')],
    ['M', cx('S7') - 30, bot('S7'), 'L', cx('S8'), top('S8')],
    ['M', cx('S8'), bot('S8'), 'V', top('S9')],
  ].map(d => `<path d="${d.join(' ')}" class="m-edge" marker-end="url(#arr)"/>`).join('')
  + [
    ['M', cx('S7') + 30, bot('S7'), 'L', cx('S10'), top('S10')],
    ['M', P('S8').x + BW, mid('S8'), 'L', P('S10').x + 20, top('S10')],
  ].map(d => `<path d="${d.join(' ')}" class="m-edge opt" marker-end="url(#arr)"/>`).join('');
  const nodes = Object.keys(MAP_NODES).map(id => {
    const { x, y } = pos(id);
    const st = stOf(id);
    let sub;
    if (id === 'GATE') sub = gateOpen() ? 'abierta' : GATE_REQS.filter(isWebDone).length + '/' + GATE_REQS.length + ' · cerrada';
    else { const pr = webProgress(WEB_MISSIONS.filter(m => m.sp === id).flatMap(m => m.steps)); sub = pr.done + '/' + pr.total + ' · ' + ST_TXT[st]; }
    const name = id === 'GATE' ? '🚦 Compuerta' : id + ' · ' + SP_SHORT[id];
    const label = (id === 'GATE' ? 'Compuerta de gasto' : id + ' ' + webSp(id).title) + ': ' + sub;
    return `<g class="m-node ${st}" data-map="${id}" role="button" tabindex="0" aria-label="${escapeHtml(label)}">
      <rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="0"/>
      <text x="${x + 10}" y="${y + 20}" class="mn-t">${st === 'locked' ? '🔒 ' : ''}${escapeHtml(name)}</text>
      <text x="${x + 10}" y="${y + 37}" class="mn-s">${escapeHtml(sub)}</text>
    </g>`;
  }).join('');
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'overlay';
  ov.innerHTML = `<div class="ov-inner">
    <div class="ov-top"><button class="ov-back" id="ovBack">Plan</button><span class="lbl">Proyecto web</span></div>
    <h1 class="d-title">Mapa de dependencias</h1>
    <p class="d-desc">Cada caja es un subproyecto; la flecha va de lo que se necesita antes a lo que desbloquea. Toca una caja para abrirla.</p>
    <div class="map-legend"><span class="lg done">hecho</span><span class="lg available">disponible</span><span class="lg locked">bloqueado</span><span class="lg opt">opcional</span></div>
    <svg class="dep-map" viewBox="0 0 ${W} ${H}" role="group" aria-label="Mapa de dependencias del proyecto web">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-arrow"/></marker></defs>
      ${edges}${nodes}
    </svg>
    <p class="map-note">Flechas simplificadas: si A lleva a B y B a C, no dibujo A → C. El detalle exacto está en cada paso (Requiere / Desbloquea).</p>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('ovBack').onclick = () => { closeOverlay(); render(); };
  ov.querySelectorAll('[data-map]').forEach(g => {
    const id = g.getAttribute('data-map');
    const go = () => {
      if (id === 'GATE') openGate(openWebMap);
      else { const first = WEB_MISSIONS.find(m => m.sp === id && missionStatus(m) !== 'done') || WEB_MISSIONS.find(m => m.sp === id); openWebMission(first.id, openWebMap); }
    };
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
  });
}

let gisPromise = null;
function loadGis(){
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if (gisPromise) return gisPromise;
  gisPromise = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client';
    sc.async = true;
    sc.onload = () => res();
    sc.onerror = () => { gisPromise = null; rej(new Error('no se pudo cargar Google')); };
    document.head.appendChild(sc);
  });
  return gisPromise;
}

}

function requestDriveToken(){
  return new Promise((res, rej) => {
    if (!(window.google && google.accounts && google.accounts.oauth2)){ loadGis().catch(() => {}); rej(new Error('Google aún está cargando; toca otra vez')); return; }
    if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE, callback: () => {} });
    tokenClient.callback = r => {
      if (!r || r.error){ rej(new Error((r && r.error) || 'sin permiso')); return; }
      try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ token: r.access_token, exp: Date.now() + (r.expires_in || 3600) * 1000 })); } catch(e){}
      state.drive.connected = true;
      saveState();
      res(r.access_token);
    };
    tokenClient.error_callback = e => rej(new Error(e && e.type === 'popup_failed_to_open' ? 'el navegador bloqueó la ventana de Google' : 'cerraste la ventana de Google'));
    tokenClient.requestAccessToken({ prompt: state.drive.connected ? '' : 'consent' });
  });
}
async function gapiFetch(url, opts){
  const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + driveToken() }, (opts && opts.headers) || {}) }));
  if (!r.ok){
    if (r.status === 401){ try { sessionStorage.removeItem(TOKEN_KEY); } catch(e){} }
    const err = new Error('Drive respondió ' + r.status);
    err.status = r.status;
    throw err;
  }
  return r.json();
}
function driveCreateFolder(name, parent){
  return gapiFetch('https://www.googleapis.com/drive/v3/files?fields=id,name,webViewLink', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ name, mimeType: MIME_FOLDER }, parent ? { parents: [parent] } : {})),
  });
}
function driveUpload(name, parent, targetMime, mediaType, content){
  const b = 'aeogeo' + Date.now();
  const body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name, mimeType: targetMime, parents: [parent] }) +
    '\r\n--' + b + '\r\nContent-Type: ' + mediaType + '; charset=UTF-8\r\n\r\n' + content + '\r\n--' + b + '--';
  return gapiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
    method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body,
  });
}
async function ensureFolder(name, retried){
  try {
    if (!state.drive.appFolderId){
      const r = await driveCreateFolder(DRIVE_APP_FOLDER, null);
      state.drive.appFolderId = r.id;
      state.drive.appFolderUrl = r.webViewLink || ('https://drive.google.com/drive/folders/' + r.id);
      saveState();
    }
    if (!state.drive.folders[name]){
      const r = await driveCreateFolder(name, state.drive.appFolderId);
      state.drive.folders[name] = r.id;
      saveState();
    }
    return state.drive.folders[name];
  } catch(e){
    // Si borraste la carpeta de la app en Drive, se vuelve a crear una vez.
    if (e.status === 404 && !retried){ state.drive.appFolderId = null; state.drive.appFolderUrl = null; state.drive.folders = {}; return ensureFolder(name, true); }
    throw e;
  }
}
async function createStartFile(key, st, retried){
  const isSheet = st.kind === 'sheet';
  const parent = await ensureFolder(st.folder);
  let f;
  try {
    f = await driveUpload(st.file, parent, isSheet ? MIME_SHEET : MIME_DOC, isSheet ? 'text/csv' : 'text/html', isSheet ? TEMPLATES[st.template].csv() : TEMPLATES[st.template].html());
  } catch(e){
    if (e.status === 404 && !retried){ state.drive.folders = {}; state.drive.appFolderId = null; return createStartFile(key, st, true); }
    throw e;
  }
  state.drive.files[key] = {
    id: f.id, name: st.file, folder: st.folder, kind: st.kind, ts: new Date().toISOString(),
    url: f.webViewLink || ('https://docs.google.com/' + (isSheet ? 'spreadsheets' : 'document') + '/d/' + f.id + '/edit'),
  };
  saveState();
  return state.drive.files[key];
}
// En la laptop, el documento se abre en una ventana a la derecha de la app; en el celular, en una pestaña o en la app de Google.
function sideFeatures(){
  if (window.innerWidth < 900 || !window.screen) return null;
  const W = screen.availWidth, H = screen.availHeight, w = Math.round(W * 0.5);
  return 'popup,width=' + w + ',height=' + H + ',left=' + (W - w) + ',top=0';
}
function openSide(url){
  const f = sideFeatures();
  const w = f ? window.open(url, 'aeogeo-tool', f) : window.open(url, '_blank');
  if (!w) showToast('El navegador bloqueó la ventana: permite ventanas emergentes para esta página');
  return w;
}
function openSideBlank(){
  const w = openSide('about:blank');
  try { if (w){ w.document.title = 'Preparando…'; w.document.body.innerHTML = '<p style="font:16px sans-serif;padding:24px;color:#494949">Preparando tu documento en Drive…</p>'; } } catch(e){}
  return w;
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch(e){ return false; }
}
function driveErrorText(e){ return 'No pude crear el documento en Drive (' + (e && (e.status || e.message)) + '). Intenta de nuevo.'; }

async function runStart(key){
  const st = getStart(key);
  if (!st) return;
  if (!state.starts[key]){ state.starts[key] = new Date().toISOString(); saveState(); }
  if (st.kind === 'link'){ window.open(st.url, '_blank', 'noopener'); return; }
  if (st.kind === 'copy'){
    const ok = await copyText(st.text);
    showToast(ok ? 'Prompt copiado: pégalo en Claude Code' : 'No pude copiar: ábrelo en "ver el prompt" y cópialo a mano');
    return;
  }
  const existing = state.drive.files[key];
  if (existing && existing.url){ openSide(existing.url); return; }
  if (!driveConfigured()){
    const ok = await copyText(TEMPLATES[st.template].text());
    openSide(st.kind === 'sheet' ? 'https://sheets.new' : 'https://docs.new');
    showToast(ok ? 'Estructura copiada: pégala en el documento nuevo (Ctrl+V)' : 'Se abrió un documento nuevo');
    return;
  }
  if (!driveToken()){
    try { await requestDriveToken(); }
    catch(e){ showToast('Google no dio permiso: ' + e.message); return; }
    try { await createStartFile(key, st); refreshStart(key); showToast('Listo: tu documento ya está en Drive. Toca "Abrir" otra vez.'); }
    catch(e){ showToast(driveErrorText(e)); }
    return;
  }
  const w = openSideBlank();
  try {
    const nf = await createStartFile(key, st);
    if (w && !w.closed) w.location.href = nf.url; else openSide(nf.url);
    refreshStart(key);
  } catch(e){
    if (w && !w.closed) w.close();
    showToast(e.status === 401 ? 'La sesión con Google venció: toca otra vez' : driveErrorText(e));
  }
}

        <button class="chat-send" id="keySave">Guardar</button>
      </div>
      <div class="chat-key-note">Tu key se guarda solo en este dispositivo (localStorage) y viaja únicamente a la API de Anthropic. El uso se cobra por consumo a tu cuenta (centavos por pregunta). Tienes que pegarla una vez por dispositivo.</div>
    </div>`;
    return html;
  }

  const chat = getChat(t.id);
  let msgs = '';
  if (chat.length === 0){
    msgs = `<div class="chat-msg assistant">Pregúntame lo que necesites sobre <b>"${escapeHtml(t.title)}"</b>. Conozco tu negocio, el mercado AEO/GEO y las reglas de compliance.</div>`;
  } else {
    chat.forEach(m => {
      if (m.role === 'user') msgs += `<div class="chat-msg user">${escapeHtml(m.content)}</div>`;
      else msgs += `<div class="chat-msg assistant">${fmtChatText(m.content)}</div>`;
    });
  }
  html += `
    <div class="chat-log" id="chatLog">${msgs}</div>
    <div class="chat-chips">
      <button class="chat-chip" data-q="¿Por qué este paso importa para mi caso específico?">Por qué importa</button>
      <button class="chat-chip" data-q="Dame un ejemplo concreto de cómo hacer esto para un exportador o SaaS de Perú.">Dame un ejemplo</button>
      <button class="chat-chip" data-q="¿Hay algún riesgo de compliance con Credicorp en este paso?">Riesgo de compliance</button>
      <button class="chat-chip" data-q="¿Cómo hago este paso más rápido sin perder calidad?">Hazlo más rápido</button>
    </div>
    <div class="chat-input-row">
      <textarea class="chat-input" id="chatInput" placeholder="Escribe tu duda sobre este paso..." rows="1"></textarea>
      <button class="chat-send" id="chatSend">Enviar</button>
    </div>
    <div class="chat-foot">
      <span class="chat-model">${CLAUDE_MODEL}</span>
      <button class="link-btn rust" id="keyManage">quitar API key</button>
    </div>
  </div>`;
  return html;
}
function scrollChat(){ const log = document.getElementById('chatLog'); if (log) log.scrollTop = log.scrollHeight; }

async function callClaude(task){
  const key = getKey();
  const history = getChat(task.id).map(m => ({ role:m.role, content:m.content }));
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens: 1024,
      system: buildSystemPrompt(task),
      messages: history
    })
  });
  if (!res.ok){
    let detail = '';
    try { const j = await res.json(); detail = (j.error && j.error.message) ? j.error.message : ''; } catch(e){}
    if (res.status === 401) throw new Error('API key inválida o vencida. Revisa que copiaste bien la key de console.anthropic.com.');
    if (res.status === 429) throw new Error('Límite de uso alcanzado (rate limit). Espera unos segundos y reintenta.');
    if (res.status === 400 && /credit|balance|billing/i.test(detail)) throw new Error('Tu cuenta de Anthropic no tiene saldo. Agrega crédito en console.anthropic.com → Billing.');
    throw new Error('Error de la API ('+res.status+'). '+detail);
  }
  const data = await res.json();
  if (data.stop_reason === 'refusal') return 'No puedo responder eso. Reformula la pregunta enfocándola en la ejecución del paso.';
  const text = (data.content||[]).filter(b => b.type==='text').map(b => b.text).join('').trim();
  return text || '(respuesta vacía — reintenta)';
}
async function sendChat(task, text){
  text = (text||'').trim();
  if (!text) return;
  getChat(task.id).push({ role:'user', content:text });
  saveState();
  render();
  const log = document.getElementById('chatLog');
  if (log){
    const thinking = document.createElement('div');
    thinking.className = 'chat-msg thinking';
    thinking.textContent = 'Claude está pensando…';
    log.appendChild(thinking);
    scrollChat();
  }
  const sendBtn = document.getElementById('chatSend');
  if (sendBtn) sendBtn.disabled = true;
  try {
    const answer = await callClaude(task);
    getChat(task.id).push({ role:'assistant', content:answer });
    saveState();
    render(); scrollChat();
  } catch(err){
    render();
    const log2 = document.getElementById('chatLog');
    if (log2){
      const errDiv = document.createElement('div');
      errDiv.className = 'chat-msg error';
      errDiv.textContent = 'Error — ' + (err.message || 'No se pudo conectar. Revisa tu conexión.');
      log2.appendChild(errDiv);
      scrollChat();
    }
  }
}

function wireView(){
  document.querySelectorAll('[data-act="compliance"]').forEach(el => { el.onclick = cycleCompliance; });

  const tgl = document.querySelector('[data-act="toggle-detail"]');
  if (tgl) tgl.onclick = () => { document.getElementById('nowDetail').classList.toggle('open'); };
  const stepDone = document.querySelector('[data-act="step-done"]');
  if (stepDone) stepDone.onclick = () => {
    const a = getNextAction();
    if (a && a.kind === 'step') markStepDone(a.task, a.stepIndex);
  };
  const missionDone = document.querySelector('[data-act="mission-done"]');
  if (missionDone) missionDone.onclick = () => {
    const a = getNextAction();
    if (a && a.kind === 'close'){
      const note = (document.getElementById('closeNote') || {value:''}).value.trim();
      completeMission(a.task, note);
    }
  };
  document.querySelectorAll('[data-act="go-coach"]').forEach(el => {
    el.onclick = () => { const a = getNextAction(); coachTaskId = a ? a.task.id : null; setTab('coach'); };
  });
  const skipBtn = document.querySelector('[data-act="skip"]');
  if (skipBtn) skipBtn.onclick = () => { const a = getNextAction(); if (a){ skipMission(a.task); render(); } };

  document.querySelectorAll('.phase-head').forEach(h => {
    h.onclick = () => { const id = h.getAttribute('data-phase'); openPhases[id] = !openPhases[id]; render(); };
  });
  document.querySelectorAll('.m-row[data-mission]').forEach(r => {
    r.onclick = () => openMissionDetail(r.getAttribute('data-mission'));
  });
  document.querySelectorAll('[data-wmission]').forEach(r => {
    r.onclick = () => openWebMission(r.getAttribute('data-wmission'));
  });
  document.querySelectorAll('[data-web="map"], [data-act="web-map"]').forEach(b => { b.onclick = openWebMap; });
  document.querySelectorAll('[data-web="gate"]').forEach(b => {
    b.onclick = () => openGate();
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openGate(); } };
  });
  document.querySelectorAll('[data-act="web-done"]').forEach(b => { b.onclick = () => requestWebStepDone(b.getAttribute('data-id'), b); });
  document.querySelectorAll('[data-act="web-open"]').forEach(b => { b.onclick = () => openWebStep(b.getAttribute('data-id')); });
  document.querySelectorAll('[data-goto-step]').forEach(b => { b.onclick = () => openWebStep(b.getAttribute('data-goto-step')); });
  document.querySelectorAll('[data-open-mission]').forEach(c => {
    const go = () => openMissionDetail(c.getAttribute('data-open-mission'));
    c.onclick = go;
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
  });
  const drvConnect = document.getElementById('drvConnect');
  if (drvConnect) drvConnect.onclick = () => {
    requestDriveToken().then(() => { render(); showToast('Google Drive conectado'); }).catch(e => showToast('No se conectó: ' + e.message));
  };
  const pvCopy = document.getElementById('pvCopy');
  if (pvCopy) pvCopy.onclick = copyRealProgress;

  const keySave = document.getElementById('keySave');
  if (keySave){
    keySave.onclick = () => {
      const v = document.getElementById('keyInput').value.trim();
      if (!v){ showToast('Pega tu API key primero'); return; }
      setKey(v); render(); showToast('Claude conectado');
    };
    const ki = document.getElementById('keyInput');
    if (ki) ki.onkeydown = (e) => { if (e.key === 'Enter'){ e.preventDefault(); keySave.click(); } };
  }
  const chatSend = document.getElementById('chatSend');
  const chatInput = document.getElementById('chatInput');
  if (chatSend && chatInput){
    chatSend.onclick = () => { const v = chatInput.value; chatInput.value = ''; sendChat(coachTask(), v); };
    chatInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); chatSend.click(); } };
  }
  document.querySelectorAll('.chat-chip').forEach(chip => {
    chip.onclick = () => sendChat(coachTask(), chip.getAttribute('data-q'));
  });
  const km = document.getElementById('keyManage');
  if (km) km.onclick = () => {
    if (confirm('¿Quitar la API key de este dispositivo? El coach dejará de funcionar hasta que pegues otra.')){
      setKey(''); render();
    }
  };

  document.querySelectorAll('.sec-h').forEach(h => {
    h.onclick = () => { const s = h.getAttribute('data-sec'); openSecs[s] = !openSecs[s]; render(); };
  });
  const bkExport = document.getElementById('bkExport');
  if (bkExport) bkExport.onclick = exportBackup;
  const bkShare = document.getElementById('bkShare');
  if (bkShare) bkShare.onclick = shareBackup;
  const bkImport = document.getElementById('bkImport');
  const bkFile = document.getElementById('bkFile');
  if (bkImport && bkFile){
    bkImport.onclick = () => { bkFile.value = ''; bkFile.click(); };
    bkFile.onchange = () => {
      const f = bkFile.files && bkFile.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => importBackupText(String(reader.result || ''));
      reader.onerror = () => alert('No pude leer el archivo. Tu progreso actual no cambió.');
      reader.readAsText(f);
    };
  }
  const bkUndo = document.getElementById('bkUndo');
  if (bkUndo) bkUndo.onclick = undoLastReplace;

  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.onclick = () => {
    if (confirm('¿Reiniciar todo el progreso del plan? Esto borra misiones, pasos, racha, notas y conversaciones. (Tu API key NO se borra.)\n\nGuardo una copia en este dispositivo por si quieres deshacerlo.')){
      saveSafetyCopy('reset');
      replaceState({});
      render();
      showToast('Progreso reiniciado.');
    }
  };
  if (currentTab === 'coach') scrollChat();
}
