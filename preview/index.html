<title>AEO–GEO Lab · prueba</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap');

/* ============================================================
   SISTEMA DE DISEÑO — look 3xn.com
   papel / arena / tinta / verde bosque / hairlines / sin sombras
   ============================================================ */
:root{
  --paper:#faf9f2;
  --paper-raise:#fffef9;
  --sand:#e3dfcb;
  --line:#e9e6d8;
  --ink:#1e1e1e;
  --body:#494949;
  --muted:#898989;
  --faint:#b5b2a4;
  --forest:#103727;
  --sage:#698175;
  --rust:#96432f;
  --ochre:#8a6d3b;
  --sans:'Schibsted Grotesk',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --tabbar-h:60px;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);color:var(--body);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  min-height:100dvh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
::selection{background:var(--sage);color:var(--paper);}
button{font-family:var(--sans);}
:focus-visible{outline:2px solid var(--forest);outline-offset:3px;}
.tnum{font-variant-numeric:tabular-nums;}

#view{max-width:680px;margin:0 auto;padding:18px 18px 40px;}

/* labels y tipografía base */
.lbl{font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.lbl.forest{color:var(--forest);}
.lbl.rust{color:var(--rust);}
.serif-i{font-family:var(--serif);font-style:italic;}

/* ============================================================
   TAB BAR (mobile abajo / desktop riel izquierdo)
   ============================================================ */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--paper);border-top:1px solid var(--ink);
  display:flex;align-items:stretch;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-brand{display:none;}
.tab-btn{
  flex:1;background:none;border:none;cursor:pointer;
  font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:color .2s ease;position:relative;
}
.tab-btn .tab-dot{width:5px;height:5px;background:transparent;transition:background .2s ease;}
.tab-btn.active{color:var(--ink);}
.tab-btn.active .tab-dot{background:var(--forest);}
.tab-btn:active{transform:translateY(1px);}

@media(min-width:900px){
  body{padding-bottom:0;}
  #tabbar{
    top:0;bottom:0;left:0;right:auto;width:200px;height:100dvh;
    flex-direction:column;align-items:flex-start;justify-content:flex-start;
    border-top:0;border-right:1px solid var(--sand);padding:34px 30px;gap:4px;
  }
  .tab-brand{display:block;margin-bottom:34px;}
  .tab-brand .tb-name{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;line-height:1;}
  .tab-brand .tb-name .dash{color:var(--sage);font-weight:400;}
  .tab-brand .tb-sub{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--muted);margin-top:5px;}
  .tab-btn{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;padding:11px 0;font-size:11px;width:100%;}
  #view{margin-left:200px;max-width:none;padding:36px 48px 60px;}
  .view-inner{max-width:640px;}
}

/* ============================================================
   HOY
   ============================================================ */
.hoy-top{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 14px;}
.hoy-brand{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;}
.hoy-brand .dash{color:var(--sage);font-weight:400;}
.hoy-date{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted);}
@media(min-width:900px){ .hoy-brand{display:none;} }

.pulse-row{
  display:flex;align-items:stretch;gap:0;border:1px solid var(--sand);
  margin-bottom:14px;background:var(--paper-raise);
}
.pulse-cell{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
.pulse-cell + .pulse-cell{border-left:1px solid var(--sand);}
.pulse-num{font-size:26px;font-weight:500;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
.pulse-num .unit{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0;}
.week-dots{display:flex;gap:5px;margin-top:3px;}
.wdot{width:8px;height:8px;background:var(--sand);}
.wdot.on{background:var(--forest);}
.wdot.today{outline:1px solid var(--ink);outline-offset:1.5px;}
.freeze-dots{display:flex;gap:4px;margin-top:6px;}
.fdot{width:7px;height:7px;border:1px solid var(--sage);}
.fdot.on{background:var(--sage);}

.goal-banner{
  display:flex;align-items:center;gap:12px;border:1px solid var(--forest);
  background:var(--forest);color:var(--paper);padding:12px 16px;margin-bottom:14px;
}
.goal-banner .gb-check{width:10px;height:10px;background:var(--paper);flex-shrink:0;}
.goal-banner .gb-text{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;}
.goal-banner .gb-sub{font-family:var(--serif);font-style:italic;font-size:13px;opacity:.85;text-transform:none;letter-spacing:0;font-weight:400;}

.comp-mini{
  display:flex;align-items:center;gap:10px;border:1px solid;padding:10px 14px;
  margin-bottom:14px;cursor:pointer;user-select:none;transition:background .2s ease;
}
.comp-mini .dot{width:8px;height:8px;flex-shrink:0;}
.comp-mini .txt{font-size:10px;letter-spacing:0.11em;text-transform:uppercase;font-weight:600;line-height:1.5;}
.comp-mini.pendiente{border-color:var(--rust);color:var(--rust);}
.comp-mini.pendiente .dot{background:var(--rust);}
.comp-mini.enviada{border-color:var(--ochre);color:var(--ochre);}
.comp-mini.enviada .dot{background:var(--ochre);}
.comp-mini:hover{background:var(--sand);}

/* tarjeta de acción principal */
.now-card{border:1px solid var(--ink);background:var(--paper);position:relative;overflow:hidden;margin-bottom:16px;}
.now-ghost{
  position:absolute;top:-12px;right:6px;font-family:var(--serif);font-size:104px;line-height:1;
  color:var(--sand);user-select:none;pointer-events:none;font-variant-numeric:tabular-nums;
}
.now-inner{padding:20px 20px 22px;position:relative;}
.now-context{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;}
.now-mission{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
.now-mission b{color:var(--body);font-weight:600;}
.now-step-label{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
.now-step-num{font-size:11px;color:var(--sage);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0.06em;}
.now-title{
  font-size:clamp(19px,4.4vw,23px);font-weight:500;line-height:1.35;color:var(--ink);
  letter-spacing:-0.015em;margin:0 0 14px;text-wrap:balance;
}
.now-title b{color:var(--forest);font-weight:600;}
.now-title i{font-family:var(--serif);font-style:italic;font-size:1.06em;}
.now-title code{background:var(--sand);padding:1px 6px;font-size:0.82em;color:var(--forest);font-style:normal;}
.now-detail{
  font-size:13px;color:var(--muted);line-height:1.65;margin:0 0 16px;
  border-left:2px solid var(--sand);padding-left:14px;display:none;
}
.now-detail.open{display:block;}
.now-detail b{color:var(--body);font-weight:600;}
.now-detail i{font-family:var(--serif);font-style:italic;color:var(--body);}
.now-detail code{background:var(--sand);padding:1px 5px;font-size:0.9em;color:var(--forest);font-style:normal;}
.now-detail-toggle{
  background:none;border:none;padding:0 0 16px;cursor:pointer;
  font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--sand);
  transition:color .2s ease;display:block;
}
.now-detail-toggle:hover{color:var(--forest);}

.btn-main{
  width:100%;background:var(--forest);color:var(--paper);border:1px solid var(--forest);
  font-size:11px;letter-spacing:0.16em;text-transform:uppercase;font-weight:600;
  padding:17px;cursor:pointer;transition:background .2s ease,transform .1s ease;border-radius:0;
}
.btn-main:hover{background:var(--ink);border-color:var(--ink);}
.btn-main:active{transform:translateY(1px);}
.btn-ghost{
  background:transparent;border:1px solid var(--ink);color:var(--ink);
  font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;
  padding:11px 18px;cursor:pointer;transition:background .2s ease,color .2s ease,transform .1s ease;border-radius:0;
}
.btn-ghost:hover{background:var(--ink);color:var(--paper);}
.btn-ghost:active{transform:translateY(1px);}
.link-btn{
  background:none;border:none;padding:2px 0;cursor:pointer;
  font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--sand);
  transition:color .2s ease;
}
.link-btn:hover{color:var(--ink);}
.link-btn.rust:hover{color:var(--rust);}
.now-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap;}

.note-input{
  width:100%;border:1px solid var(--sand);background:var(--paper-raise);
  padding:13px 15px;font-family:var(--sans);font-size:13.5px;color:var(--ink);
  resize:vertical;min-height:64px;margin-bottom:14px;line-height:1.55;border-radius:0;
  transition:border-color .2s ease;
}
.note-input:focus{outline:none;border-color:var(--ink);}
.note-input::placeholder{color:var(--faint);}

.mini-progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.mini-track{flex:1;height:2px;background:var(--sand);overflow:hidden;}
.mini-fill{height:100%;background:var(--forest);transition:width .45s cubic-bezier(.22,1,.36,1);}

/* ============================================================
   PLAN
   ============================================================ */
.view-title{font-size:24px;font-weight:500;color:var(--ink);letter-spacing:-0.02em;margin:10px 0 4px;}
.view-sub{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);margin-bottom:22px;}

.plan-total{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
.plan-total .pct{font-size:13px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;}

.phase-sec{margin-bottom:8px;border-top:1px solid var(--ink);}
.phase-head{
  display:flex;justify-content:space-between;align-items:center;padding:15px 0;cursor:pointer;user-select:none;
}
.phase-head .ph-l{display:flex;align-items:baseline;gap:10px;}
.phase-head .ph-num{font-size:11px;color:var(--sage);font-weight:600;font-variant-numeric:tabular-nums;}
.phase-head .ph-name{font-size:12px;letter-spacing:0.13em;text-transform:uppercase;font-weight:600;color:var(--ink);}
.phase-head .ph-count{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:0.06em;}
.phase-body{display:none;padding-bottom:14px;}
.phase-body.open{display:block;}
.m-row{
  display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;
  transition:background .15s ease;
}
.m-row:hover{background:var(--paper-raise);}
.m-num{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px;min-width:22px;}
.m-check{
  width:15px;height:15px;border:1px solid var(--faint);flex-shrink:0;margin-top:3px;
  display:flex;align-items:center;justify-content:center;
}
.m-row.done .m-check{background:var(--forest);border-color:var(--forest);}
.m-row.done .m-check::after{content:"";width:7px;height:4px;border-left:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);transform:rotate(-45deg) translate(0.5px,-1px);}
.m-row.current .m-check{border-color:var(--forest);}
.m-main{flex:1;min-width:0;}
.m-title{font-size:14px;font-weight:500;color:var(--ink);line-height:1.45;}
.m-row.done .m-title{color:var(--muted);}
.m-meta{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--faint);margin-top:2px;}
.m-meta .cur{color:var(--forest);font-weight:600;}
.m-meta .gate{color:var(--rust);}

/* ============================================================
   DETALLE DE MISIÓN (overlay)
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.ov-inner{max-width:680px;margin:0 auto;padding:16px 18px 40px;}
@media(min-width:900px){ .ov-inner{max-width:640px;padding-top:36px;} }
.ov-top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 18px;}
.ov-back{
  background:none;border:none;cursor:pointer;padding:4px 0;
  font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.ov-back::before{content:"";width:7px;height:7px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg);}
.ov-back:hover{color:var(--forest);}
.d-title{font-size:clamp(22px,4.6vw,28px);font-weight:500;line-height:1.25;color:var(--ink);letter-spacing:-0.02em;margin:6px 0 12px;text-wrap:balance;}
.d-desc{font-size:14.5px;line-height:1.65;color:var(--body);margin-bottom:12px;max-width:62ch;}
.d-meta{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:20px;display:flex;flex-wrap:wrap;gap:6px 0;}
.d-meta .sep{margin:0 10px;color:var(--faint);}
.d-meta .gate{color:var(--rust);}
.why-box{margin:0 0 20px;padding-left:16px;border-left:2px solid var(--forest);}
.why-label{font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--forest);font-weight:600;margin-bottom:5px;}
.why-text{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.55;color:var(--ink);max-width:58ch;}

.step-block{border-top:1px solid var(--line);}
.step-row{display:flex;gap:13px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);}
.step-row.tappable{cursor:pointer;}
.s-num{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px;min-width:20px;}
.s-check{
  flex-shrink:0;width:17px;height:17px;border:1px solid var(--ink);margin-top:3px;
  display:flex;align-items:center;justify-content:center;transition:background .18s ease,border-color .18s ease;
}
.step-row.done .s-check{background:var(--forest);border-color:var(--forest);}
.step-row.done .s-check::after{content:"";width:8px;height:4.5px;border-left:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);transform:rotate(-45deg) translate(0.5px,-1px);}
.step-row.locked .s-check{border-color:var(--faint);}
.s-main{flex:1;min-width:0;}
.s-title{font-size:14px;font-weight:500;color:var(--ink);line-height:1.5;max-width:62ch;}
.step-row.done .s-title{color:var(--muted);}
.s-title b{color:var(--forest);font-weight:600;}
.s-title i{font-family:var(--serif);font-style:italic;font-size:1.06em;}
.s-title code{background:var(--sand);padding:1px 6px;font-size:0.86em;color:var(--forest);font-style:normal;}
.s-detail{font-size:12.5px;color:var(--muted);line-height:1.65;margin-top:5px;max-width:60ch;}
.s-detail b{color:var(--body);font-weight:600;}
.s-detail i{font-family:var(--serif);font-style:italic;color:var(--body);}
.s-detail code{background:var(--sand);padding:1px 5px;font-size:0.9em;color:var(--forest);font-style:normal;}

.tip-box{margin-top:18px;background:var(--sand);padding:14px 18px;}
.tip-label{font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ochre);font-weight:600;margin-bottom:4px;}
.tip-text{font-size:13px;color:var(--body);line-height:1.6;max-width:60ch;}
.tip-text b{color:var(--ink);}
.d-note{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);margin-top:16px;border-left:2px solid var(--sand);padding-left:14px;}
.d-actions{margin-top:22px;display:flex;flex-direction:column;gap:14px;}

/* ============================================================
   COACH (chat)
   ============================================================ */
.coach-ctx{border:1px solid var(--sand);background:var(--paper-raise);padding:12px 16px;margin-bottom:18px;}
.coach-ctx .cc-l{font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--forest);font-weight:600;margin-bottom:3px;}
.coach-ctx .cc-t{font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.4;}
.chat-log{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.chat-msg{font-size:13.5px;line-height:1.6;max-width:90%;}
.chat-msg.user{align-self:flex-end;background:var(--ink);color:var(--paper);padding:10px 14px;}
.chat-msg.assistant{align-self:flex-start;border-left:2px solid var(--sand);padding:2px 0 2px 14px;color:var(--body);}
.chat-msg.assistant b{color:var(--forest);}
.chat-msg.assistant code{background:var(--sand);padding:1px 5px;font-size:0.88em;color:var(--forest);}
.chat-msg.thinking{align-self:flex-start;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;padding-left:16px;}
.chat-msg.error{align-self:stretch;max-width:100%;border-left:2px solid var(--rust);padding:2px 0 2px 14px;color:var(--rust);font-size:12.5px;}
.chat-chips{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:16px;}
.chat-chip{
  font-size:11px;letter-spacing:0.08em;text-transform:uppercase;font-weight:500;color:var(--muted);
  background:none;border:none;padding:2px 0;cursor:pointer;
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--sand);
  transition:color .2s ease;
}
.chat-chip:hover{color:var(--forest);text-decoration-color:var(--forest);}
.chat-input-row{display:flex;gap:10px;align-items:stretch;}
.chat-input{
  flex:1;border:1px solid var(--sand);background:var(--paper-raise);padding:11px 13px;
  font-family:var(--sans);font-size:13.5px;color:var(--ink);resize:none;min-height:46px;max-height:120px;line-height:1.5;border-radius:0;
  transition:border-color .2s ease;
}
.chat-input:focus{outline:none;border-color:var(--ink);}
.chat-input::placeholder{color:var(--faint);}
.chat-send{
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:0 18px;
  font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;cursor:pointer;border-radius:0;
  transition:background .2s ease,transform .1s ease;
}
.chat-send:hover{background:var(--forest);border-color:var(--forest);}
.chat-send:active{transform:translateY(1px);}
.chat-send:disabled{opacity:.4;cursor:not-allowed;}
.chat-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.chat-model{font-size:9.5px;letter-spacing:0.08em;color:var(--faint);text-transform:uppercase;}
.chat-key-input{
  flex:1;border:1px solid var(--sand);background:var(--paper-raise);padding:11px 13px;
  font-family:var(--sans);font-size:12.5px;color:var(--ink);letter-spacing:0.02em;border-radius:0;
  transition:border-color .2s ease;
}
.chat-key-input:focus{outline:none;border-color:var(--ink);}
.chat-connect-sub{font-size:13px;color:var(--body);line-height:1.6;margin-bottom:14px;max-width:58ch;}
.chat-connect-sub a{color:var(--forest);font-weight:600;text-underline-offset:3px;}
.chat-key-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55;max-width:60ch;}

/* ============================================================
   DATOS
   ============================================================ */
.comp-full{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  border:1px solid;padding:13px 18px;margin-bottom:24px;cursor:pointer;user-select:none;
  transition:background .2s ease,color .2s ease,border-color .2s ease;
}
.comp-full .cl{display:flex;align-items:center;gap:11px;min-width:0;}
.comp-full .dot{width:9px;height:9px;flex-shrink:0;}
.comp-full .txt{font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;font-weight:500;line-height:1.5;}
.comp-full .hint{font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;opacity:.65;}
.comp-full.pendiente{border-color:var(--rust);color:var(--rust);}
.comp-full.pendiente .dot{background:var(--rust);}
.comp-full.enviada{border-color:var(--ochre);color:var(--ochre);}
.comp-full.enviada .dot{background:var(--ochre);}
.comp-full.aprobada{border-color:var(--forest);color:var(--paper);background:var(--forest);}
.comp-full.aprobada .dot{background:var(--paper);}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--sand);background:var(--paper-raise);margin-bottom:28px;}
.stat-cell{padding:14px 12px;display:flex;flex-direction:column;gap:4px;}
.stat-cell + .stat-cell{border-left:1px solid var(--sand);}
.stat-cell .sn{font-size:22px;font-weight:500;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
@media(max-width:420px){ .stats-grid{grid-template-columns:repeat(2,1fr);} .stat-cell:nth-child(3){border-left:0;} .stat-cell:nth-child(3),.stat-cell:nth-child(4){border-top:1px solid var(--sand);} }

.sec-h{font-size:10.5px;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink);font-weight:600;padding:16px 0 12px;border-top:1px solid var(--ink);margin-top:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.sec-h .plus{font-size:17px;font-weight:400;line-height:1;width:16px;text-align:center;transition:transform .25s ease;display:inline-block;}
.sec-h .plus.open{transform:rotate(45deg);}
.sec-body{display:none;padding-bottom:20px;}
.sec-body.open{display:block;}

.hist-row{display:flex;align-items:flex-start;gap:13px;padding:12px 0;border-top:1px solid var(--line);}
.hist-check{width:14px;height:14px;background:var(--forest);flex-shrink:0;margin-top:4px;display:flex;align-items:center;justify-content:center;}
.hist-check::after{content:"";width:6px;height:3.5px;border-left:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);transform:rotate(-45deg) translate(0.5px,-1px);}
.hist-main{flex:1;min-width:0;}
.hist-t{font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.45;}
.hist-note{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.5;}
.hist-when{font-size:10px;color:var(--faint);white-space:nowrap;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:0.06em;text-transform:uppercase;}
.hist-empty{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);padding:14px 0;}

.gloss-slabel{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--forest);font-weight:600;margin:20px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--sand);}
.gloss-item{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line);}
.gloss-marker{min-width:22px;font-size:11px;color:var(--sage);font-weight:600;padding-top:2px;font-variant-numeric:tabular-nums;}
.gloss-marker.neg{color:var(--rust);}
.gloss-main{flex:1;min-width:0;}
.gloss-item h4{margin:0 0 3px;font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.4;}
.gloss-item p{margin:0;font-size:12.5px;color:var(--body);line-height:1.6;max-width:60ch;}
.gloss-item p b{color:var(--ink);}
.gloss-item code{background:var(--sand);padding:1px 5px;font-size:0.88em;color:var(--forest);}

.app-foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--sand);display:flex;flex-direction:column;gap:12px;}
.app-foot .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;}
.app-note{font-size:11px;color:var(--muted);line-height:1.55;max-width:60ch;}

.backup-box{border:1px solid var(--sand);background:var(--paper-raise);padding:16px 18px;margin-bottom:28px;}
.backup-box .bk-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.backup-box .bk-last{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted);}
.backup-box .bk-note{font-size:11.5px;color:var(--muted);line-height:1.55;margin:0 0 14px;}
.backup-box .bk-actions{display:flex;gap:10px;flex-wrap:wrap;}
.backup-box .bk-actions .btn-ghost{min-height:44px;flex:1 1 140px;}
.backup-box .bk-undo{margin-top:14px;}

/* ============================================================
   SHEET DE CELEBRACIÓN (recompensa variable)
   ============================================================ */
.sheet-backdrop{
  position:fixed;inset:0;z-index:80;background:rgba(30,30,30,0.4);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadein .2s ease;
}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.sheet{
  background:var(--paper);border:1px solid var(--ink);border-bottom:0;
  width:100%;max-width:560px;padding:30px 26px calc(30px + env(safe-area-inset-bottom));
  animation:sheetup .28s cubic-bezier(.22,1,.36,1);
}
@keyframes sheetup{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@media(min-width:900px){
  .sheet-backdrop{align-items:center;}
  .sheet{border-bottom:1px solid var(--ink);padding-bottom:30px;}
}
.sheet-check{width:14px;height:14px;background:var(--forest);margin-bottom:16px;animation:popin .35s cubic-bezier(.22,1.4,.36,1);}
@keyframes popin{0%{transform:scale(0);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
.sheet-title{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--ink);line-height:1.2;margin-bottom:8px;}
.sheet-line{font-size:13.5px;color:var(--body);line-height:1.6;margin-bottom:20px;max-width:52ch;}
.insight-card{border:1px solid var(--sand);background:var(--paper-raise);padding:16px 18px;margin-bottom:22px;}
.insight-l{font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--forest);font-weight:600;margin-bottom:6px;}
.insight-t{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.4;}
.insight-d{font-size:12.5px;color:var(--body);line-height:1.6;}
.insight-d b{color:var(--ink);}
.insight-d code{background:var(--sand);padding:1px 5px;font-size:0.88em;color:var(--forest);}
.sheet-extra{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--sage);font-weight:600;margin-bottom:18px;}

.toast{
  position:fixed;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:0.04em;
  padding:12px 20px;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;z-index:90;
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(min-width:900px){ .toast{bottom:28px;} }

.all-done{text-align:center;padding:70px 20px;}
.all-done .ad-t{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--ink);margin-bottom:10px;}
.all-done .ad-s{font-size:14px;color:var(--muted);line-height:1.65;max-width:46ch;margin:0 auto;}
/* ============================================================

   ============================================================ */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  display:inline-block;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;font-style:normal;font-family:var(--sans);

}
.opt-tag{display:inline-block;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:var(--sage);margin-left:4px;}

.bsheet-bd{position:fixed;inset:0;z-index:90;background:rgba(30,30,30,.38);display:flex;align-items:flex-end;justify-content:center;animation:bsfade .18s ease;}
.bsheet{
  background:var(--paper);width:100%;max-width:560px;max-height:85dvh;overflow-y:auto;outline:none;
  border-top:1px solid var(--ink);padding:4px 20px calc(24px + env(safe-area-inset-bottom));animation:bsup .22s ease;
}
@keyframes bsfade{from{opacity:0;}to{opacity:1;}}
@keyframes bsup{from{transform:translateY(24px);}to{transform:translateY(0);}}

}
.sh-status{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;color:var(--forest);margin-bottom:8px;}

.sh-title{font-size:19px;font-weight:500;line-height:1.35;color:var(--ink);letter-spacing:-0.01em;margin:0 0 6px;}

.sh-date{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);margin-bottom:12px;}
.sh-note{font-size:13px;color:var(--body);line-height:1.6;border-left:2px solid var(--ochre);padding-left:12px;margin:0 0 14px;}
.sh-none{font-size:13.5px;color:var(--rust);line-height:1.6;margin:6px 0 0;}

.pay-row{display:flex;gap:10px;margin:14px 0 16px;}
.pay-row select,.pay-row input{
  min-height:48px;border:1px solid var(--sand);background:var(--paper-raise);font-family:var(--sans);font-size:16px;color:var(--ink);padding:0 12px;border-radius:0;
}
.pay-row input{flex:1;min-width:0;}

.w-row{cursor:pointer;}
.w-row .s-num{min-width:40px;}

.w-st{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.w-st.done{color:var(--forest);}
.w-st.locked{color:var(--rust);}
.lock-box{border:1px solid var(--rust);padding:14px 16px;margin:0 0 18px;}
.lock-h{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;color:var(--rust);margin-bottom:10px;}
.lock-sub{font-size:12px;color:var(--muted);margin-top:10px;}
.linked-box{font-size:13.5px;line-height:1.6;border-left:2px solid var(--ochre);padding-left:14px;margin:0 0 16px;}
.cost-line,.dep-row{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:13.5px;line-height:1.6;padding:11px 0;border-top:1px solid var(--line);color:var(--body);}
.cl-l{font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px;}
.w-sec-h{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;color:var(--ink);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--ink);}

.w-steps li{font-size:14.5px;color:var(--ink);line-height:1.65;margin-bottom:9px;padding-left:2px;}
.w-steps li b{color:var(--forest);font-weight:600;}
.w-steps code,.cost-line code{background:var(--sand);padding:1px 5px;font-size:0.88em;color:var(--forest);}
.placeholder-box{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);border:1px dashed var(--sand);padding:14px 16px;margin:16px 0;line-height:1.5;}
.deps{margin:18px 0 6px;}
.req-links{display:flex;flex-wrap:wrap;gap:6px;}
.req-link{
  min-height:40px;padding:0 11px;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:0.05em;cursor:pointer;
  border:1px solid var(--ink);background:var(--paper-raise);color:var(--ink);
}

.req-link.locked{border-color:var(--faint);border-style:dashed;color:var(--muted);}
.none-txt{font-family:var(--serif);font-style:italic;color:var(--muted);}
.src-list{margin-top:22px;border-top:1px solid var(--ink);}
.src-list-h{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;color:var(--ink);padding:14px 0 4px;}
.src-row{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
  padding:12px 0;min-height:48px;cursor:pointer;font-family:var(--sans);
}

.src-meta{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.done-line{font-size:13.5px;color:var(--forest);font-weight:500;}
.done-line .forced{color:var(--rust);}
.btn-main:disabled{background:var(--faint);border-color:var(--faint);cursor:not-allowed;transform:none;}

.gate-list{border-top:1px solid var(--ink);}
.gate-item{display:flex;gap:13px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);}
.g-check{flex-shrink:0;width:18px;height:18px;border:1px solid var(--ink);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--paper);}
.gate-item.ok .g-check{background:var(--forest);border-color:var(--forest);}
.g-label{font-size:14px;color:var(--ink);font-weight:500;line-height:1.45;margin-bottom:8px;}
.gate-item.ok .g-label{color:var(--muted);}
.gate-foot{margin-top:18px;padding:14px 16px;border:1px solid var(--rust);color:var(--rust);font-size:13.5px;line-height:1.55;}

.gate-foot .gf-sub{font-size:12px;opacity:.85;}

.web-sec{margin-top:36px;padding-top:16px;border-top:2px solid var(--forest);}
.web-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.web-tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px;}
.web-tools .btn-ghost{flex:1 1 150px;min-height:44px;}
.gate-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;min-height:48px;border-top:1px solid var(--ink);cursor:pointer;
  font-size:12px;letter-spacing:0.13em;text-transform:uppercase;font-weight:600;color:var(--rust);margin-bottom:8px;
}
.gate-row.open{color:var(--forest);}
.m-lock{font-size:9px;line-height:1;}
.m-meta .cost-badge{font-size:9.5px;padding:0 5px;}

.alt-card{border:1px solid var(--sand);background:var(--paper-raise);padding:14px 16px;cursor:pointer;margin-bottom:16px;}

.alt-title{font-size:14px;font-weight:500;color:var(--ink);margin:5px 0 2px;line-height:1.4;}

.web-now .now-step-label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.now-what{font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;font-weight:600;color:var(--forest);margin:4px 0 8px;}
.now-steps{margin:0 0 14px;padding-left:20px;}
.now-steps li{font-size:14px;color:var(--ink);line-height:1.6;margin-bottom:7px;}

.now-done{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:13px;line-height:1.55;color:var(--body);padding:10px 0;border-top:1px solid var(--line);margin-bottom:16px;}
.now-pending{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.5;color:var(--muted);border:1px dashed var(--sand);padding:12px 14px;margin:2px 0 18px;}

.map-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 14px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}

.dep-map{display:block;width:100%;height:auto;max-width:420px;margin:0 auto;}

.mn-t{font-family:var(--sans);font-size:11.5px;font-weight:600;fill:var(--ink);}
.mn-s{font-family:var(--sans);font-size:9.5px;fill:var(--muted);letter-spacing:0.04em;}
.m-node.done .mn-t,.m-node.done .mn-s{fill:var(--paper);}
.m-node.locked .mn-t{fill:var(--muted);}

const BUSINESS_CONTEXT = `Abraham, 28, ingeniero industrial, Product Owner de Lending en Credicorp Capital (banca privada, Lima). Trabajo muy exigente por ~7 meses. Patrón propio: tiende a no terminar proyectos → necesita pasos secuenciales, concretos y enfocados, sin dispersarse.

NEGOCIO: agencia BOUTIQUE "productizada" de consultoría AEO/GEO (Answer/Generative Engine Optimization) en español para LATAM. AEO/GEO = lograr que una marca aparezca/sea citada cuando alguien le pregunta a ChatGPT, Perplexity, Gemini o Claude qué solución/proveedor usar. NO es construir software ni webs de clientes: es servicio/ejecución. Entrega 100% asíncrona: video Loom SIN ROSTRO + reporte en Notion, por email. Sin reuniones en horario laboral.

POSICIONAMIENTO (clave del análisis de mercado): el mercado AEO/GEO está bifurcado en (1) plataformas SaaS de medición muy financiadas — Profound superó los US$155M levantados y llegó a US$1.000M de valuación en feb 2026, con otra ronda reportada de US$180M a US$1.800M en sept 2026; AthenaHQ (Y Combinator); Goodie; Otterly; Rankscale; Scrunch; Peec — y (2) agencias de servicios — First Page Sage (fundada en 2009, sin rondas de inversión conocidas; ingresos estimados por terceros entre US$8M y más de US$50M). Abraham se para en la capa de SERVICIOS, NO de software (construir SaaS exige capital VC que no tiene ni quiere). Modelo a EMULAR: First Page Sage — bootstrapped, rentable, construido sobre autoridad de contenido (su propio blog rankea tan alto que los LLMs lo citan), sin tecnología propia. En vez de construir herramienta, REVENDE una barata: Otterly.AI (US$29/mes en Lite, prueba de 14 días, programa para agencias) o Rankscale (desde US$20/mes).

QUÉ FUNCIONA DE VERDAD (lo más validado, en orden): (a) contenido answer-first y estructurado — respuesta directa arriba, párrafos cortos, jerarquía de headings, listas, tablas, definiciones explícitas, datos con fuente citada; (b) autoridad de marca y citas de terceros / Digital PR — aparecer en listas/rankings que posicionan bien, reviews en G2/Clutch/Capterra/Trustpilot, menciones en publicaciones autoritativas; (c) presencia auténtica en Reddit/Quora/foros del sector (los LLMs entrenan con contenido de comunidad). SOBREVALORADO — no perder tiempo aquí: llms.txt (DESCARTADO: no se implementa ni se recomienda a clientes; John Mueller de Google lo comparó con la etiqueta meta keywords y un estudio de Ahrefs de junio de 2026 encontró que el 97% de los archivos llms.txt no recibe solicitudes) y schema markup como "driver directo de citas" (schema sigue sirviendo para SEO clásico/rich results, que alimentan AI Overviews indirectamente, así que se incluye como higiene SEO, pero NO es la palanca principal de citas de IA). Gran parte de lo que las agencias venden como "GEO técnico" tiene impacto cuestionable; vender humo técnico quema credibilidad.

MEDICIÓN / ROI (obstáculo #1 de la industria, aún más agudo en LatAm): las plataformas de IA NO muestran tráfico referido de forma confiable. Las fuentes citadas cambian mucho con el tiempo (Profound reporta, según resúmenes de su estudio, 40-60% de dominios al mes y 70-90% en seis meses) y cada modelo usa fuentes distintas. NO prometer tráfico de "último clic"; prometer y reportar MÉTRICAS DE PRESENCIA: citation rate (tasa de citación), share of answer (cuánto apareces vs competidores), prompt visibility. El argumento de venta más fuerte NO son las estadísticas de mercado (varían 4x entre fuentes de market research de segundo nivel, sesgadas) sino la DEMOSTRACIÓN: "le pregunté a ChatGPT/Perplexity exactamente lo que preguntan tus clientes; acá están los screenshots; no apareces, tu competidor sí".

PRICING (referencia LatAm): auditoría/diagnóstico US$300-800 (gancho, puede ser gratis al inicio); retainer básico US$800-1,500/mes (PYMEs, servicios profesionales); retainer crecimiento US$1,500-3,000/mes (SaaS, exportadores, B2B). El mercado USA cobra US$2,000-12,000/mes — no competir ahí; los precios LatAm son una ventaja, no una debilidad. Meta de Abraham: ~3 retainers ≈ S/10,500/mes (supera S/10,000); hito intermedio fin 2026 ≈ S/5,000/mes. Capital de arranque US$400-700.

CLIENTES IDEALES (por claridad de ROI): (1) EXPORTADORES / empresas B2B que venden a clientes GLOBALES — los compradores internacionales usan ChatGPT para investigar proveedores = caso de ROI más claro y el mejor primer cliente; (2) SaaS y fintech (digital-first, presupuesto de marketing); (3) servicios profesionales de alto ticket (estudios legales, clínicas, consultoras); (4) ecommerce con catálogo. Perfil: digital-first, 10-100 empleados, ya invierte en marketing, decisor que sigue tendencias tech. NO microemprendimientos sin presupuesto (el concepto les es muy abstracto), NO corporaciones gigantes inalcanzables.

COMPLIANCE (CRÍTICO): el Código de Ética de Credicorp aplica 24/7. Debe DECLARAR la actividad externa a la Unidad de Cumplimiento ANTES de compartir o publicar su web (una web pública ofreciendo servicios ya es una actividad visible; criterio, no política pública) y en todo caso antes de cobrarle al primer cliente.

      { title:'Estudia las dos capas del mercado: <b>plataformas SaaS de medición</b> (Profound, AthenaHQ [[M03]], Goodie, Otterly, Rankscale, Scrunch, Peec) vs <b>agencias de ejecución</b> (First Page Sage y SEOs tradicionales que añaden GEO).', detail:'Las plataformas compiten por la capa de medición y necesitan capital VC. Las agencias compiten por la ejecución. Tú compites en ejecución/servicio: no construyes tecnología que te obligaría a competir con empresas valuadas en US$1.000M [[M01]].' },
      { title:'Adopta el modelo de <b>First Page Sage</b> como tu plantilla: fundada en 2009, sin rondas de inversión conocidas, con ingresos que terceros estiman entre US$8M y más de US$50M [[M04]], construida sobre autoridad de contenido y sin tecnología propia. Que su blog sea su motor de captación es tu lectura del modelo {{criterio}}.', detail:'Es el modelo de agencia GEO más exitoso y replicable, y el más relevante para emular en LatAm. Lo vas a copiar: contenido como motor de captación, no software.' },
      { title:'Decide de forma explícita: <b>NO vas a construir software</b>. Vas a REVENDER una herramienta barata de medición (Otterly/Rankscale) y vender tu criterio + ejecución encima.', detail:'Construir un SaaS te metería a competir por capital y producto contra gigantes. Revender + ejecutar te deja en la capa donde un solo con bajo capital sí gana margen.' },
      { title:'Internaliza la advertencia sobre operadores OPACOS. Ejemplo: AEO Engine publica un "920%" cuya definición, plazo y muestra cambian entre sus propias páginas, sin auditoría externa [[M14]]. Desconfía de toda cifra sin línea base ni metodología.', detail:'Tu diferenciador será exactamente lo contrario: casos de estudio verificables, con método y fechas. Una cifra sin validación independiente es una advertencia, no un modelo.' },
    ],
    tip:'El mercado LatAm en español se está abriendo pero NO está saturado: hay ~una decena de agencias (conteo sin verificar), así que el "first mover" puro ya no existe, pero hay ventana real si te diferencias por verticalización y casos verificables (los dos pilares de las fases finales).',

  {

    title:'Aprender qué SÍ mueve las citas (y qué está sobrevalorado)',
    desc:'El aprendizaje más valioso del análisis: gran parte del "GEO técnico" que venden las agencias (empezando por llms.txt) tiene impacto cuestionable. Saber dónde poner el esfuerzo te hace efectivo, honesto y rápido.',
    minutes:75, tag:'Método',
    why:'Si vendes lo mismo sobrevalorado que el resto (llms.txt, schema como protagonista), eres un commodity más. Si vendes lo que de verdad mueve la aguja —contenido + autoridad— te diferencias y entregas resultados reales que sostienen casos verificables.',
    tutorial:[
      { title:'Prioriza lo MÁS validado: <b>contenido answer-first y estructurado</b> — respuesta directa arriba, párrafos cortos, jerarquía clara de headings, listas, tablas, definiciones explícitas y datos con fuente citada.', detail:'Un estudio académico encontró que optimizar el contenido (citar fuentes, sumar estadísticas y citas) puede subir la visibilidad en respuestas generativas hasta 40% [[M06]]. Si solo dominaras una cosa, que sea esta: es el pilar #1 y el más replicable.' },
      { title:'Segundo pilar: <b>autoridad de marca y citas de terceros (Digital PR)</b> — aparecer en listas/rankings que posicionan bien, reviews en G2/Clutch/Capterra/Trustpilot, menciones en publicaciones autoritativas.', detail:'Ahrefs, con 75 mil marcas, encontró que las menciones de marca en la web son el factor más correlacionado con aparecer en AI Overviews, más que los backlinks [[M16]]. Importa lo que MUCHAS fuentes externas dicen de una marca, no solo lo que la marca dice de sí misma. Construir esa autoridad externa es trabajo de relaciones y contenido, no de código.' },
      { title:'Tercer pilar: <b>presencia auténtica en Reddit, Quora y foros</b> del sector del cliente.', detail:'Reddit licenció su contenido para entrenar IA a Google y a OpenAI en 2024 [[M15]]; una participación genuina (aportar valor, no spamear) puede traducirse en citas. Es de bajo costo y alto valor.' },
      { title:'<span class="drop-tag">descartado</span> <code>llms.txt</code>: no lo implementes ni lo recomiendes. John Mueller (Google) lo comparó con la etiqueta <i>meta keywords</i>: es lo que el dueño del sitio dice de sí mismo [[F38]]. Un análisis de Ahrefs sobre 137 mil sitios encontró que el 97% de esos archivos no recibió ninguna solicitud en un mes [[L01]]. Sobrevalorado también: el <b>schema markup como "driver directo de citas"</b>.', detail:'Google dice que no hace falta ningún schema especial ni archivo de IA para aparecer en AI Overviews y AI Mode, y que ignora llms.txt [[M07]]. Schema sí sirve para SEO clásico y rich results, así que lo incluyes como higiene técnica — pero NO lo vendas como la palanca principal de citas de IA. Vender humo técnico te quema la credibilidad que tanto cuesta construir.' },
    ],
    tip:'La mayoría de tu competencia vende "GEO técnico" que no mueve la aguja. Que tu oferta se ancle en contenido citable + autoridad + presencia comunitaria es, por sí solo, un diferenciador frente a casi todos.',

    tutorial:[
      { title:'Suscríbete a UNA herramienta de medición barata y revendible: <b>Otterly.AI</b> (US$29/mes en Lite [[F11]]; cubre ChatGPT, AI Overviews, Perplexity y Copilot, y tiene programa para agencias [[M10]]) o <b>Rankscale</b> (desde US$20/mes, con prueba de 7 días en su plan Pro [[M09]]).', detail:'Esta es tu "tecnología": la revendes dentro de tu servicio. Para los primeros 1-2 audits puedes usar el método manual gratis (screenshots) y sumar la herramienta cuando un cliente la justifique. Tu capital total de arranque queda en US$400-700.' },

      { title:'Arma el resto del stack gratuito: <b>Screaming Frog</b> (gratis hasta 500 URLs [[M11]]) y <code>schema.org/validator</code> para la higiene técnica, <b>Google Search Console</b> (ya incluye AI Overviews y AI Mode [[M08]]), <b>Loom</b> (gratis: 25 videos de hasta 5 minutos [[M12]]) y <b>Notion</b> para la entrega async.', detail:'Con esto cubres medición, auditoría técnica y entrega sin gastar casi nada. Ojo: el plan gratis de Loom corta a los 5 minutos; para entregables de 15-20 minutos necesitarás un plan pago o dividir el video. Recuerda: la parte técnica es higiene, no el protagonista.' },
      { title:'Graba un Loom de práctica de 2-3 min, <b>sin rostro</b>, recorriendo un dashboard de Otterly/Rankscale, para practicar voz y ritmo.', detail:'El Loom es la cara del negocio (sin mostrar tu cara real). Practicar ahora te quita el nervio para el primer entregable real y te ayuda a bajar el tiempo de entrega.' },

// Valida el grafo: IDs inexistentes, pasos huérfanos o repetidos, ciclos y fuentes.
// Devuelve una lista de errores (vacía = todo bien). Lo usan la app y tests/plan-deps.test.js.
function validateWebPlan(p){
  const errors = [];
  const stepIds = Object.keys(p.steps);
  const nodeIds = new Set(stepIds.concat([p.gate.id]));
  const spIds = new Set(p.subprojects.map(s => s.id));
  const seen = {};
  p.missions.forEach(m => {
    if (!spIds.has(m.sp)) errors.push('Misión ' + m.id + ': subproyecto inexistente ' + m.sp);
    m.steps.forEach(id => {
      if (!p.steps[id]) errors.push('Misión ' + m.id + ': paso inexistente ' + id);
      if (seen[id]) errors.push('Paso ' + id + ' está en dos misiones: ' + seen[id] + ' y ' + m.id);
      seen[id] = m.id;
    });
  });
  stepIds.forEach(id => { if (!seen[id]) errors.push('Paso ' + id + ' no pertenece a ninguna misión'); });
  const reqsOf = id => id === p.gate.id ? p.gate.items.flatMap(i => i.ids) : (p.steps[id].requires || []);
  nodeIds.forEach(id => reqsOf(id).forEach(r => {
    if (!nodeIds.has(r)) errors.push(id + ' requiere un ID inexistente: ' + r);
    if (r === id) errors.push(id + ' se requiere a sí mismo');
  }));
  // Ciclos (DFS con colores)
  const color = {};
  const stack = [];
  const visit = id => {
    color[id] = 1; stack.push(id);
    for (const r of reqsOf(id)){
      if (!nodeIds.has(r)) continue;
      if (color[r] === 1){ errors.push('Ciclo: ' + stack.slice(stack.indexOf(r)).concat(r).join(' → ')); continue; }
      if (!color[r]) visit(r);
    }
    stack.pop(); color[id] = 2;
  };
  nodeIds.forEach(id => { if (!color[id]) visit(id); });
  // Fuentes referenciadas
  const refRe = /\[\[([A-Za-z0-9-]+)\]\]/g;
  const checkSrc = (where, sid) => { if (!p.sources[sid]) errors.push(where + ': fuente inexistente ' + sid); };
  stepIds.forEach(id => {
    const s = p.steps[id];
    (s.sources || []).forEach(sid => checkSrc(id, sid));
    ((s.cost && s.cost.sourceIds) || []).forEach(sid => checkSrc(id + ' (costo)', sid));
    const texts = [s.cost && s.cost.note, s.start && s.start.then].concat(s.body ? [].concat(s.body.steps || [], s.body.why || [], s.body.extra || [], s.body.done || []) : []);
    texts.filter(Boolean).forEach(t => { let mm; refRe.lastIndex = 0; while ((mm = refRe.exec(t))) checkSrc(id, mm[1]); });
    if (s.start && ['link','copy','doc','sheet'].indexOf(s.start.kind) < 0) errors.push(id + ': "Empieza aquí" con tipo desconocido ' + s.start.kind);
  });
  (p.costTable || []).forEach(r => {
    if (r.step && !p.steps[r.step]) errors.push('Costos "' + r.concept + '": paso inexistente ' + r.step);
    (r.sources || []).forEach(sid => checkSrc('Costos "' + r.concept + '"', sid));
  });
  return errors;
}

const BACKUP_APP = 'aeo-geo-lab';

function fmtDateTime(iso){
  return new Date(iso).toLocaleString('es-PE', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function countMarkedSteps(s){
  let n = 0;
  Object.values(s.stepProgress || {}).forEach(p => { Object.values(p || {}).forEach(v => { if (v) n++; }); });
  return n;
}
function progressSummary(s){
  const m = Object.keys(s.completed || {}).length;
  const p = countMarkedSteps(s);
  return m + (m === 1 ? ' misión completada' : ' misiones completadas') + ' · ' + p + (p === 1 ? ' paso marcado' : ' pasos marcados') + ' · racha ' + (s.streak || 0);
}
function backupFileName(){ return 'aeo-geo-respaldo-' + todayKey() + '.json'; }
function buildBackupText(){
  state.lastBackupAt = new Date().toISOString();
  saveState();
  return JSON.stringify({
    app: BACKUP_APP,
    format: BACKUP_FORMAT,
    exportedAt: state.lastBackupAt,
    storageKey: STORAGE_KEY,
    state: state,
  }, null, 2);
}
function exportBackup(){

function canShareFiles(){

    if (!navigator.canShare) return false;
    return navigator.canShare({ files:[new File(['{}'], 'x.json', { type:'application/json' })] });
  } catch(e){ return false; }
}
async function shareBackup(){
  const file = new File([buildBackupText()], backupFileName(), { type:'application/json' });
  try {
    await navigator.share({ files:[file], title:'Respaldo AEO–GEO' });
    showToast('Respaldo enviado');
  } catch(e){
    if (e && e.name !== 'AbortError') showToast('No se pudo compartir — usa "Descargar"');
  }
  render();
}
function parseBackup(text){
  let obj;
  try { obj = JSON.parse(text); } catch(e){ throw new Error('El archivo no es un JSON válido.'); }
  if (!obj || typeof obj !== 'object') throw new Error('El archivo está vacío o dañado.');
  if (obj.app && obj.app !== BACKUP_APP) throw new Error('Este archivo es de otra app, no de AEO–GEO.');
  const s = obj.state || obj;
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  if (!isObj(s) || !isObj(s.completed)) throw new Error('Este archivo no parece un respaldo de AEO–GEO.');
  if (s.stepProgress !== undefined && !isObj(s.stepProgress)) throw new Error('El respaldo tiene los pasos dañados.');
  return { state: s, exportedAt: obj.exportedAt || null };
}
function saveSafetyCopy(reason){
  try {
    localStorage.setItem(SAFETY_KEY, JSON.stringify({ savedAt: new Date().toISOString(), reason, state }));
    return true;
  } catch(e){ return false; }
}
function getSafetyCopy(){
  try { const raw = localStorage.getItem(SAFETY_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function replaceState(next){
  state = Object.assign(defaultState(), next);
  normalizeState();
  state.migratedV2 = true;
  saveState();
}
function importBackupText(text){
  let parsed;
  try { parsed = parseBackup(text); }
  catch(e){ alert('No pude restaurar el respaldo.\n\n' + e.message + '\n\nTu progreso actual no cambió.'); return; }
  const when = parsed.exportedAt ? ('del ' + fmtDateTime(parsed.exportedAt)) : '(sin fecha)';
  const ok = confirm(
    'Restaurar respaldo ' + when + ':\n' + progressSummary(parsed.state) +
    '\n\nReemplazará tu progreso actual:\n' + progressSummary(state) +
    '\n\nAntes guardo una copia de tu progreso actual en este dispositivo, para que puedas deshacer.'
  );
  if (!ok) return;
  if (!saveSafetyCopy('import')){ alert('No pude guardar la copia de seguridad previa, así que no restauré nada. Tu progreso actual no cambió.'); return; }
  replaceState(parsed.state);
  render();
  showToast('Respaldo restaurado');
}
function undoLastReplace(){
  const copy = getSafetyCopy();
  if (!copy || !copy.state) return;
  if (!confirm('¿Volver al progreso que tenías el ' + fmtDateTime(copy.savedAt) + '?\n' + progressSummary(copy.state))) return;
  replaceState(copy.state);
  try { localStorage.removeItem(SAFETY_KEY); } catch(e){}
  render();
  showToast('Progreso anterior recuperado');
}

// ============================================================
function dayKey(d){ return d.toISOString().slice(0,10); }
function todayKey(){ return dayKey(new Date()); }
function daysBetween(a, b){
  const da = new Date(a + 'T00:00:00Z'), db = new Date(b + 'T00:00:00Z');
  return Math.round((db - da) / 86400000);
}
function displayStreak(){
  if (!state.lastActiveDay) return 0;
  const gap = daysBetween(state.lastActiveDay, todayKey());
  if (gap <= 1) return state.streak;
  return (state.freezes >= gap - 1) ? state.streak : 0;
}
function recordActivity(){
  const today = todayKey();
  const prev = state.lastActiveDay;
  let frozeUsed = 0;
  if (prev !== today){
    if (!prev){ state.streak = 1; }
    else {
      const gap = daysBetween(prev, today);
      if (gap === 1) state.streak += 1;
      else if (gap > 1){
        const need = gap - 1;
        if (state.freezes >= need){ state.freezes -= need; state.streak += 1; frozeUsed = need; }
        else state.streak = 1;
      }
    }
    state.lastActiveDay = today;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
  }
  state.activityLog[today] = (state.activityLog[today] || 0) + 1;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
  Object.keys(state.activityLog).forEach(k => { if (k < dayKey(cutoff)) delete state.activityLog[k]; });
  saveState();
  if (frozeUsed > 0) showToast(frozeUsed === 1 ? 'Usaste 1 protector — racha intacta' : ('Usaste ' + frozeUsed + ' protectores — racha intacta'));
}
function goalMetToday(){ return (state.activityLog[todayKey()] || 0) >= 1; }

const UNVERIFIED_TASKS = new Set(['f5','v1','v2','v3','v4','v5','p1','p2','p3','p4','p5','e1','e2','e3','e4']);
function unverTag(id){ return UNVERIFIED_TASKS.has(id) ? '<span class="unv-tag">sin verificar</span>' : ''; }
function linearBlockers(taskId, i){ const r = LINEAR_REQUIRES[taskId + ':' + i]; return r ? r.filter(x => !isWebDone(x)) : []; }
function syncLinearFromWeb(){
  Object.keys(LINEAR_REQUIRES).forEach(k => {
    const [tid, idx] = k.split(':');
    if (!LINEAR_REQUIRES[k].every(isWebDone)) return;
    const p = getStepProgress(tid);
    if (!p[idx]){ p[idx] = true; }
  });
}
function getNextTask(){ const a = getNextAction(); return a ? a.task : null; }
function getStepProgress(taskId){
  if (!state.stepProgress[taskId]) state.stepProgress[taskId] = {};
  return state.stepProgress[taskId];
}
// La unidad atómica de la app: el siguiente PASO pendiente del plan.
// Una misión que solo tiene pendientes pasos en espera del proyecto web no frena las siguientes.
function getNextAction(){
  for (const task of TASKS){
    if (state.completed[task.id]) continue;
    const steps = task.tutorial || [];
    const prog = getStepProgress(task.id);
    let waiting = false;
    for (let i = 0; i < steps.length; i++){
      if (prog[i]) continue;
      if (linearBlockers(task.id, i).length){ waiting = true; continue; }
      return { task, stepIndex: i, kind:'step' };
    }
    if (!waiting) return { task, stepIndex: null, kind:'close' };
  }
  return null;
}
function pickInsight(){
  if (!INSIGHT_DECK.length) return null;
  let unseen = INSIGHT_DECK.map((c,i) => i).filter(i => !state.seenInsights.includes(i));
  if (!unseen.length){ state.seenInsights = []; unseen = INSIGHT_DECK.map((c,i) => i); }
  const idx = unseen[Math.floor(Math.random() * unseen.length)];
  state.seenInsights.push(idx);
  saveState();
  return INSIGHT_DECK[idx];
}

    const done = tasks.filter(t => state.completed[t.id]).length;
    const open = !!openPhases[p.id];
    html += `<section class="phase-sec">
      <div class="phase-head" data-phase="${p.id}">
        <span class="ph-l"><span class="ph-num tnum">${pad2(pi+1)}</span><span class="ph-name">${PHASE_LABELS[p.id]}</span></span>
        <span class="ph-count tnum">${done}/${tasks.length}</span>
      </div>
      <div class="phase-body${open?' open':''}">`;
    tasks.forEach(t => {
      const idx = TASKS.findIndex(x => x.id === t.id);
      const isDone = !!state.completed[t.id];
      const isCurrent = current && current.id === t.id;
      html += `<div class="m-row${isDone?' done':''}${isCurrent?' current':''}" data-mission="${t.id}">
        <span class="m-num tnum">${pad2(idx+1)}</span>
        <span class="m-check"></span>
        <div class="m-main">
          <div class="m-title">${t.title}</div>
          <div class="m-meta">${isCurrent ? '<span class="cur">Actual</span> — ' : ''}${t.minutes} min · ${t.tag}${t.gate==='compliance' ? ' · <span class="gate">compliance</span>' : ''}${UNVERIFIED_TASKS.has(t.id) ? ' · ' + unverTag(t.id) : ''}</div>
        </div>
      </div>`;
    });
    html += `</div></section>`;
  });
  html += webTrackHtml();
  return html + '</div>';
}

function closeOverlay(){ const ov = document.getElementById('overlay'); if (ov) ov.remove(); }
function openMissionDetail(taskId){

  if (!t) return;
  const idx = TASKS.findIndex(x => x.id === taskId);
  const current = getNextTask();

  const isDone = !!state.completed[t.id];
  const steps = t.tutorial || [];
  const prog = getStepProgress(t.id);

        <div class="s-title">${rich(st.title)}</div>

        ${!sd ? startMiniHtml(t.id + ':' + i) : ''}

    <div class="ov-top">
      <button class="ov-back" id="ovBack">Plan</button>
      <span class="lbl">Misión ${pad2(idx+1)}/${TOTAL}</span>
    </div>
    <span class="lbl forest">${PHASE_LABELS[t.phase]}</span>

    <p class="d-desc">${rich(t.desc)}</p>
    <div class="d-meta">
      <span>${t.minutes} min</span><span class="sep">&mdash;</span><span>${t.tag}</span>
      ${t.gate==='compliance' ? '<span class="sep">&mdash;</span><span class="gate">Requiere compliance aprobada</span>' : ''}
      ${isDone ? '<span class="sep">&mdash;</span><span style="color:var(--forest);">Completada</span>' : (isCurrent ? '<span class="sep">&mdash;</span><span style="color:var(--forest);">Actual</span>' : '<span class="sep">&mdash;</span><span>Se desbloquea en orden</span>')}
    </div>
    ${UNVERIFIED_TASKS.has(t.id) ? '<div class="unver-box">⚠️ <b>Datos sin verificar.</b> Las cifras, precios y nombres de esta misión vienen del análisis original y todavía no tienen fuente. Tómalos como referencia, no como hecho.</div>' : ''}
    ${t.why ? `<div class="why-box"><div class="why-label">Por qué importa</div><div class="why-text">${rich(t.why)}</div></div>` : ''}
    <div class="mini-progress"><span class="lbl tnum">${doneSteps}/${steps.length}</span><div class="mini-track"><div class="mini-fill" style="width:${steps.length?Math.round((doneSteps/steps.length)*100):0}%"></div></div></div>
    <div class="step-block">${stepsHtml}</div>
    ${t.tip ? `<div class="tip-box"><div class="tip-label">Nota</div><div class="tip-text">${rich(t.tip)}</div></div>` : ''}
    ${isDone && state.completed[t.id].note ? `<div class="d-note">"${escapeHtml(state.completed[t.id].note)}"</div>` : ''}
    <div class="d-actions">
      ${isCurrent && doneSteps === steps.length ? `<textarea class="note-input" id="ovNote" placeholder="Anota algo: qué hiciste, qué salió, qué falta..."></textarea><button class="btn-main" id="ovComplete">Marcar misión completada</button>` : ''}
      ${isCurrent ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;"><button class="link-btn" id="ovCoach">Preguntar a Claude</button><button class="link-btn" id="ovSkip">saltar esta misión</button></div>` : ''}

  </div>`;
  document.body.appendChild(ov);

  document.getElementById('ovBack').onclick = closeOverlay;
  ov.querySelectorAll('[data-goto-step]').forEach(b => { b.onclick = e => { e.stopPropagation(); openWebStep(b.getAttribute('data-goto-step'), () => openMissionDetail(taskId)); }; });
  if (isCurrent){
    ov.querySelectorAll('[data-step]').forEach(row => {
      row.onclick = () => {
        const i = row.getAttribute('data-step');
        const p = getStepProgress(t.id);
        const wasDone = !!p[i];
        p[i] = !p[i];
        if (!wasDone){ recordActivity(); vibrate(10); }
        saveState();
        closeOverlay(); openMissionDetail(t.id);
      };
    });
    const ovSkip = document.getElementById('ovSkip');
    if (ovSkip) ovSkip.onclick = () => { skipMission(t); closeOverlay(); render(); };
    const ovCoach = document.getElementById('ovCoach');
    if (ovCoach) ovCoach.onclick = () => { coachTaskId = t.id; closeOverlay(); setTab('coach'); };

// ============================================================
function markStepDone(task, stepIndex){
  const prog = getStepProgress(task.id);
  prog[stepIndex] = true;
  recordActivity();
  vibrate(12);
  saveState();
  const steps = task.tutorial || [];
  const remaining = steps.filter((s,i) => !prog[i]).length;
  showCelebration({
    title: 'Paso hecho.',
    line: remaining > 0
      ? (pickCelebration() + ' Te ' + (remaining === 1 ? 'queda 1 paso' : ('quedan ' + remaining + ' pasos')) + ' en esta misión.')
      : 'Ese era el último paso — la misión está lista para cerrarse.',
    insight: pickInsight(),
  });
}
function completeMission(task, note, after){
  if (task.gate === 'compliance' && state.compliance !== 'aprobada'){
    const go = confirm('Ojo: esta misión implica cobrar, pero Compliance no está en APROBADA.\n\nNo deberías cobrarle a un cliente antes de que Cumplimiento de Credicorp apruebe tu declaración.\n\n¿Ya está aprobada y quieres continuar igual?');
    if (!go) return;
  }
  state.completed[task.id] = { note: note || '', ts: new Date().toISOString() };
  state.freezes = Math.min(2, state.freezes + 1);
  recordActivity();
  vibrate(24);
  saveState();
  const doneCount = Object.keys(state.completed).length;
  showCelebration({
    title: 'Misión completada.',
    line: pickCelebration() + ' Llevas ' + doneCount + ' de ' + TOTAL + ' misiones del plan.',
    insight: pickInsight(),
    extra: 'Ganaste 1 protector de racha',
  });
  if (after) after();
}
function skipMission(task){
  const idx = TASKS.findIndex(t => t.id === task.id);
  if (idx > -1 && idx < TASKS.length-1){
    const [t] = TASKS.splice(idx,1);
    TASKS.splice(Math.min(idx+3, TASKS.length), 0, t);
  }
  showToast('Misión pospuesta — vuelve en unas misiones');
}

function showCelebration({title, line, insight, extra}){
  const bd = document.createElement('div');
  bd.className = 'sheet-backdrop'; bd.id = 'sheetBackdrop';
  bd.innerHTML = `<div class="sheet">
    <div class="sheet-check"></div>
    <div class="sheet-title">${title}</div>
    <div class="sheet-line">${line}</div>
    ${extra ? `<div class="sheet-extra">${extra}</div>` : ''}
    ${insight ? `<div class="insight-card"><div class="insight-l">Dato del mercado — ${insight.sec}${/\[\[/.test(insight.d) ? '' : ' · sin verificar'}</div><div class="insight-t">${insight.t}</div><div class="insight-d">${rich(insight.d)}</div></div>` : ''}
    <button class="btn-main" id="sheetGo">Seguir</button>
  </div>`;
  document.body.appendChild(bd);
  const close = () => { bd.remove(); render(); };
  document.getElementById('sheetGo').onclick = close;
  bd.onclick = (e) => { if (e.target === bd) close(); };
}

// PROYECTO WEB: estado, dependencias y costos
// ============================================================
const WEB_STEP_IDS = WEB_MISSIONS.flatMap(m => m.steps);
const GATE_REQS = WEB_GATE.items.flatMap(i => i.ids);
const WEB_UNLOCKS = (() => {
  const u = { GATE: [] };
  WEB_STEP_IDS.forEach(id => { u[id] = []; });
  WEB_STEP_IDS.forEach(id => WEB_STEPS[id].requires.forEach(r => u[r].push(id)));
  GATE_REQS.forEach(r => u[r].push('GATE'));
  return u;
})();
const SP_SHORT = { S1:'Base segura', S2:'Taller local', S3:'Investigación', S4:'Diseño', S5:'Construcción', S6:'Prueba gratis', S7:'Dominio y correo', S8:'Legal', S9:'Medición', S10:'Opcionales $' };

function webMission(id){ return WEB_MISSIONS.find(m => m.steps.includes(id)); }
function webSp(id){ return WEB_SUBPROJECTS.find(s => s.id === id); }
function gateOpen(){ return GATE_REQS.every(isWebDone); }
function isWebDone(id){
  if (id === 'GATE') return gateOpen();
  if (WEB_STEPS[id] && WEB_STEPS[id].linked === 'compliance') return state.compliance === 'aprobada';
  return !!state.webSteps[id];
}
function webReqs(id){ return id === 'GATE' ? GATE_REQS : WEB_STEPS[id].requires; }
function missingReqs(id){ return webReqs(id).filter(r => !isWebDone(r)); }
function webStatus(id){ return isWebDone(id) ? 'done' : (missingReqs(id).length ? 'locked' : 'available'); }
function requiredSteps(ids){ return ids.filter(id => !WEB_STEPS[id].optional); }
function webProgress(ids){
  const req = requiredSteps(ids);
  const base = req.length ? req : ids;
  return { done: base.filter(isWebDone).length, total: base.length };
}
function spStatus(spId){
  const ids = WEB_MISSIONS.filter(m => m.sp === spId).flatMap(m => m.steps);
  const pr = webProgress(ids);
  if (pr.done === pr.total) return 'done';
  return ids.some(id => !isWebDone(id) && webStatus(id) === 'available' && !WEB_STEPS[id].linked) ? 'available' : 'locked';
}
function missionStatus(m){
  const pr = webProgress(m.steps);
  if (pr.done === pr.total) return 'done';
  return m.steps.some(id => webStatus(id) === 'available' && !WEB_STEPS[id].linked) ? 'available' : 'locked';
}
function idLabel(id){ return id === 'GATE' ? '🚦 Compuerta' : id; }

// --- Costos ---
function fmtMoney(amount, currency){
  const n = Math.round(amount * 100) / 100;
  return (currency === 'PEN' ? 'S/ ' : 'US$') + (Number.isInteger(n) ? n : n.toFixed(2));
}
function isPaidStep(s){ return s.cost.type === 'fixed' || s.cost.type === 'usage' || s.cost.type === 'unknown'; }
function costBadgeText(cost){
  let txt;
  if (cost.type === 'free') txt = 'S/ 0';
  else if (cost.type === 'included') txt = 'Incluido';
  else if (cost.type === 'usage') txt = 'Pago por uso';
  else if (cost.type === 'fixed') txt = fmtMoney(cost.amount, cost.currency) + (cost.period === 'month' ? '/mes' : '');
  else return '❓ costo';
  if (cost.status === 'nuance') txt += ' ⚠️';
  else if (cost.status === 'none') txt += ' ❓';
  return txt;
}
function costBadge(cost){
  const cls = cost.type === 'unknown' ? ' unk' : (cost.type === 'fixed' || cost.type === 'usage' ? ' pay' : '');
  return `<span class="cost-badge${cls}">${costBadgeText(cost)}</span>`;
}
function missionCostBadge(m){
  const costs = requiredSteps(m.steps).map(id => WEB_STEPS[id].cost);
  const all = costs.length ? costs : m.steps.map(id => WEB_STEPS[id].cost);
  const fixed = all.filter(c => c.type === 'fixed');
  if (fixed.length){
    const usd = fixed.filter(c => c.currency !== 'PEN').reduce((a, c) => a + c.amount, 0);
    return `<span class="cost-badge pay">${fmtMoney(usd, 'USD')}${fixed.some(c => c.period === 'month') ? '/mes' : ''}${all.some(c => c.type === 'unknown') ? ' + ❓' : ''}</span>`;
  }
  if (all.some(c => c.type === 'usage')) return '<span class="cost-badge pay">Pago por uso</span>';
  if (all.some(c => c.type === 'unknown')) return '<span class="cost-badge unk">❓ costo</span>';
  return '<span class="cost-badge">S/ 0</span>';
}
function spentTotals(){
  const t = {};
  Object.values(state.webSteps).forEach(r => {
    if (r && r.paid && r.paid.amount > 0) t[r.paid.currency] = (t[r.paid.currency] || 0) + r.paid.amount;
  });
  return t;
}
function spentText(){
  const t = spentTotals();
  const parts = Object.keys(t).map(c => fmtMoney(t[c], c));
  return parts.length ? parts.join(' + ') : 'S/ 0';
}
function upcomingMandatory(){
  return WEB_STEP_IDS.filter(id => { const s = WEB_STEPS[id]; return !s.optional && s.cost.type === 'fixed' && s.cost.mandatory && !isWebDone(id); });
}

// --- Citas: chips, hoja inferior y lista de fuentes ---
const SRC_ICON = { ok:'✅', nuance:'⚠️', none:'❓' };
const SRC_TEXT = { ok:'Verificado', nuance:'Matizado', none:'Sin fuente encontrada' };
function fmtDay(iso){ return new Date(iso + (iso.length === 10 ? 'T12:00:00' : '')).toLocaleDateString('es-PE', { day:'numeric', month:'short', year:'numeric' }); }
function srcLabel(s){ return (s.status === 'none' && !s.url) ? 'sin fuente' : s.site; }
function chipHtml(id){
  const s = SOURCES[id];
  if (!s) return '';
  return `<button type="button" class="cite-chip st-${s.status}" data-src="${id}" aria-label="Fuente: ${escapeHtml(srcLabel(s))}. ${SRC_TEXT[s.status]}. Ver detalle"><span aria-hidden="true">${SRC_ICON[s.status]}</span>${escapeHtml(srcLabel(s))}</button>`;
}
function critTag(){ return '<span class="crit-tag" title="Recomendación, no un dato">recomendación</span>'; }
function rich(str){
  return String(str || '').replace(/\[\[([A-Za-z0-9-]+)\]\]/g, (_, id) => chipHtml(id)).replace(/\{\{criterio\}\}/g, critTag());
}
function stepSourceIds(id){
  const s = WEB_STEPS[id];
  const ids = [].concat(s.sources || [], s.cost.sourceIds || []);
  const texts = [s.cost.note].concat(s.body ? [].concat(s.body.steps || [], s.body.why || [], s.body.extra || [], s.body.done || []) : []);
  texts.filter(Boolean).forEach(t => { (t.match(/\[\[([A-Za-z0-9-]+)\]\]/g) || []).forEach(x => ids.push(x.slice(2, -2))); });
  return [...new Set(ids)].filter(x => SOURCES[x]);
}
function sourcesListHtml(ids){
  if (!ids.length) return '';
  return `<div class="src-list"><div class="src-list-h">Fuentes</div>${ids.map(id => {
    const s = SOURCES[id];
    return `<button type="button" class="src-row cite-chip-row" data-src="${id}">
      <span class="src-ic" aria-hidden="true">${SRC_ICON[s.status]}</span>
      <span class="src-main"><span class="src-claim">${escapeHtml(s.claim)}</span><span class="src-meta">${escapeHtml(srcLabel(s))} · ${SRC_TEXT[s.status]}</span></span>
    </button>`;
  }).join('')}</div>`;
}

let bsheet = null;
function openBSheet(inner, opener, labelId){
  closeBSheet(false);
  const bd = document.createElement('div');
  bd.className = 'bsheet-bd';
  bd.innerHTML = `<div class="bsheet" role="dialog" aria-modal="true" aria-labelledby="${labelId}" tabindex="-1">
    <div class="bsheet-top"><span class="bsheet-grip" aria-hidden="true"></span><button type="button" class="bsheet-close" data-bsheet-close>Cerrar</button></div>
    ${inner}
  </div>`;
  bd.addEventListener('click', e => { if (e.target === bd || e.target.closest('[data-bsheet-close]')) closeBSheet(true); });
  const sheet = bd.querySelector('.bsheet');
  bd.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ e.preventDefault(); closeBSheet(true); return; }
    if (e.key !== 'Tab') return;
    const f = [...sheet.querySelectorAll('a[href],button,input,select,textarea')].filter(x => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
  });
  document.body.appendChild(bd);
  bsheet = { bd, opener };
  sheet.focus();
  return sheet;
}
function closeBSheet(restoreFocus){
  if (!bsheet) return;
  const { bd, opener } = bsheet;
  bsheet = null;
  bd.remove();
  if (restoreFocus && opener && document.contains(opener)) opener.focus();
}
function openSourceSheet(id, opener){
  const s = SOURCES[id];
  if (!s) return;
  const checked = !s.verifiedAt
    ? 'Pendiente de verificar'
    : (s.status === 'none' ? 'Buscado el ' + fmtDay(s.verifiedAt) + ': sin fuente encontrada' : 'Verificado el ' + fmtDay(s.verifiedAt));
  let host = '';
  try { host = s.url ? new URL(s.url).hostname.replace(/^www\./, '') : ''; } catch(e){}
  openBSheet(`
    <div class="sh-status st-${s.status}">${SRC_ICON[s.status]} ${SRC_TEXT[s.status]}</div>
    <h2 class="sh-title" id="shTitle">${escapeHtml(s.claim)}</h2>
    <div class="sh-site">${escapeHtml(s.site)}${host ? ' · ' + escapeHtml(host) : ''}</div>
    <div class="sh-date">${checked}</div>
    ${s.note ? `<div class="sh-note"><b>${s.status === 'nuance' ? 'Matiz' : 'Nota'}:</b> ${escapeHtml(s.note)}</div>` : ''}
    ${s.url
      ? `<a class="btn-main sh-open" href="${escapeHtml(s.url)}" target="_blank" rel="noopener">Abrir fuente</a>`
      : `<p class="sh-none">No hay una fuente pública para este dato. No lo tomes como un hecho.</p>`}
  `, opener, 'shTitle');
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-src]');
  if (!c) return;
  e.preventDefault();
  e.stopPropagation();
  openSourceSheet(c.getAttribute('data-src'), c);

// --- Marcar pasos del proyecto web ---
function openPaySheet(id, opener, onSave){

    <div class="pay-row">
      <select id="payCur" aria-label="Moneda"><option value="USD"${cur === 'USD' ? ' selected' : ''}>US$</option><option value="PEN"${cur === 'PEN' ? ' selected' : ''}>S/</option></select>
      <input id="payAmt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="${s.cost.amount != null ? s.cost.amount : '0.00'}" aria-label="Monto pagado">

    onSave({ amount, currency });
